<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Correas, Poleas y Polines — CMP (En línea)</title>
<link rel="stylesheet" href="shared.css">
<script src="poleas-data.js"></script>
<script src="polines-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body,#root { height:100%; }  :root{ --fs-nav:0.85rem; --fs-caps:0.72rem; --fs-chip:0.78rem; }
  body { overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100vh; background:var(--op-bg); overflow:hidden; }

  /* NAVBAR — identity layer */
  .navbar { background:var(--id-bg); border-bottom:2px solid var(--cmp-hematita-600); padding:0 20px; height:52px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .nb-left { display:flex; align-items:center; gap:12px; }
  .nb-logo { height:42px; background:transparent; padding:0; display:flex; align-items:center; flex-shrink:0; overflow:visible; }
  .nb-brand { display:flex; flex-direction:column; gap:1px; }
  .nb-name { font-size:0.857rem; font-weight:600; color:#fff; letter-spacing:.04em; }
  .nb-sub  { font-size:0.714rem; color:var(--cmp-blue-300); }
  .nb-right { display:flex; align-items:center; gap:10px; }
  .nb-status { display:flex; align-items:center; gap:4px; font-size:0.714rem; color:var(--cmp-blue-300); }
  .nb-pulse { width:6px; height:6px; border-radius:50%; background:var(--status-running); }
  .nb-time { font-size:0.857rem; color:var(--cmp-blue-200); font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .nb-user { padding:3px 10px; background:var(--cmp-blue-700); border-radius:var(--radius-1); font-size:0.786rem; color:var(--cmp-blue-100); display:flex; align-items:center; gap:5px; }
  .nb-btn { padding:4px 11px; background:rgba(255,255,255,0.07); border:1px solid var(--cmp-blue-700); color:var(--cmp-blue-100); border-radius:var(--radius-1); font-size:var(--fs-chip); font-weight:500; cursor:pointer; font-family:var(--font-sans); transition:all .12s; display:flex; align-items:center; gap:5px; }
  .nb-btn:hover { background:var(--cmp-blue-700); color:#fff; border-color:var(--cmp-blue-500); }

  /* BREADCRUMB */
  .breadcrumb { background:var(--op-surface-1); border-bottom:1px solid var(--op-border-subtle); padding:0 20px; height:32px; display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .bc-item { font-size:0.786rem; color:var(--op-text-3); }
  .bc-item.active { color:var(--op-text-1); font-weight:500; }
  .bc-sep { color:var(--op-text-3); font-size:0.714rem; }
  .alarm-badge { font-size:0.714rem; font-weight:500; padding:2px 8px; border-radius:var(--radius-1); white-space:nowrap; }

  /* PROCESS + TAB SELECTOR */
  .selbar { background:var(--op-surface-1); border-bottom:1px solid var(--op-border-subtle); padding:8px 20px; display:flex; align-items:center; gap:16px; flex-shrink:0; flex-wrap:wrap; }
  .sel-label { font-size:0.714rem; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--op-text-3); }
  .proc-btn { display:inline-flex; align-items:center; gap:7px; padding:5px 14px; border:1px solid var(--op-border-subtle); background:var(--op-surface-2); border-radius:var(--radius-1); font-family:var(--font-sans); font-size:var(--fs-nav); font-weight:500; color:var(--op-text-2); cursor:pointer; transition:all .12s; }
  .proc-btn:hover { border-color:var(--op-border-strong); color:var(--op-text-1); }
  .proc-btn.active { background:var(--cmp-blue-700); border-color:var(--cmp-blue-500); color:#fff; font-weight:600; }
  .proc-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .tabs { background:var(--op-surface-0); border-bottom:1px solid var(--op-border-subtle); padding:0 20px; display:flex; gap:0; overflow-x:auto; flex-shrink:0; }
  .tabs.has-feeders { padding:0; flex-direction:column; overflow-x:visible; }
  .tabs-row { display:flex; gap:0; overflow-x:auto; padding:0 20px; }
  .tabs-row.feeder-row { background:rgba(82,160,108,0.06); border-top:1px solid var(--op-border-subtle); }
  .tabs-row-label { font-size:var(--fs-caps); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--op-text-3); display:flex; align-items:center; padding:0 10px 0 20px; white-space:nowrap; flex-shrink:0; border-right:1px solid var(--op-border-subtle); }
  .tab { padding:9px 14px; border:none; background:transparent; color:var(--op-text-3); font-family:var(--font-sans); font-weight:500; font-size:var(--fs-nav); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all .12s; display:flex; align-items:center; gap:7px; }
  .tab:hover { color:var(--op-text-1); background:var(--op-surface-1); }
  .tab.active { color:#fff; border-bottom-color:var(--cmp-hematita-500); font-weight:600; }
  .tab-alarm { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .tab-badge { min-width:15px; height:15px; padding:0 4px; border-radius:999px; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; font-variant-numeric:tabular-nums; color:#fff; background:var(--alarm-critical); font-family:var(--font-sans); }

  /* MAIN */
  .main { flex:1; overflow-y:auto; padding:14px 20px 20px; }

  /* KPI strip */
  .kpi-strip { display:grid; grid-template-columns:repeat(4,1fr) 1.6fr; gap:10px; margin-bottom:14px; }
  .kpi { background:var(--op-surface-1); border:1px solid var(--op-border-subtle); border-top:3px solid var(--op-border-subtle); border-radius:var(--radius-2); padding:10px 14px; }
  .kpi-lbl { font-size:0.714rem; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--op-text-3); margin-bottom:5px; }
  .kpi-val { font-size:1.7rem; font-weight:300; font-variant-numeric:tabular-nums; line-height:1; color:var(--op-text-1); display:flex; align-items:baseline; gap:4px; }
  .kpi-unit { font-size:0.786rem; color:var(--op-text-3); }
  .kpi-sub { font-size:0.714rem; color:var(--op-text-3); margin-top:5px; }

  /* Prominent TBO panel */
  .kpi-tbo { background:linear-gradient(105deg, var(--cmp-blue-900), var(--op-surface-2)); border:1px solid var(--cmp-blue-600); border-left:4px solid var(--cmp-blue-400); border-radius:var(--radius-2); padding:10px 14px; display:flex; flex-direction:column; }
  .kpi-tbo.venc { background:linear-gradient(105deg, #3a1411, var(--op-surface-2)); border-color:var(--alarm-critical-border); border-left-color:var(--alarm-critical); }
  .kpi-tbo-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .kpi-tbo-lbl { font-size:0.714rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--cmp-blue-200); display:flex; align-items:center; gap:5px; }
  .kpi-tbo.venc .kpi-tbo-lbl { color:var(--alarm-critical-light); }
  .tbo-edit { padding:3px 10px; font-size:0.714rem; font-weight:500; background:rgba(255,255,255,0.07); border:1px solid var(--cmp-blue-600); color:var(--cmp-blue-200); border-radius:var(--radius-1); cursor:pointer; font-family:var(--font-sans); transition:all .12s; flex-shrink:0; display:flex; align-items:center; gap:4px; }
  .tbo-edit:hover { background:var(--cmp-blue-700); color:#fff; border-color:var(--cmp-blue-400); }
  .kpi-tbo.venc .tbo-edit { border-color:var(--alarm-critical-border); color:var(--alarm-critical-light); }
  .kpi-tbo.venc .tbo-edit:hover { background:var(--alarm-critical-bg); }
  .kpi-tbo-date { font-size:1.9rem; font-weight:400; font-variant-numeric:tabular-nums; line-height:1.05; color:#fff; display:flex; align-items:center; gap:8px; letter-spacing:.01em; }
  .kpi-tbo.venc .kpi-tbo-date { color:var(--alarm-critical-light); }
  .tbo-flag { color:var(--alarm-critical); }
  .kpi-tbo-sub { font-size:0.786rem; color:var(--cmp-blue-300); margin-top:5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .kpi-tbo.venc .kpi-tbo-sub { color:var(--alarm-critical-light); font-weight:500; }
  .kpi-tbo-edited { font-size:0.667rem; color:var(--cmp-hematita-300); border:1px solid var(--cmp-hematita-700); padding:0 5px; border-radius:var(--radius-1); }

  /* Belt header */
  .belt-hdr { background:var(--op-surface-2); border:1px solid var(--op-border-subtle); border-left:3px solid var(--cmp-blue-500); border-radius:var(--radius-2); padding:9px 14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .belt-name { font-size:1rem; font-weight:500; color:var(--op-text-1); }
  .belt-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .belt-chip { font-size:var(--fs-chip); font-family:var(--font-mono); color:var(--op-text-2); background:var(--op-surface-3); border:1px solid var(--op-border-subtle); padding:2px 8px; border-radius:var(--radius-1); }
  .belt-chip-ok { font-family:var(--font-sans); color:var(--status-running-light); border-color:var(--status-running-border); background:var(--status-running-bg); }
  .belt-chip-crit { font-family:var(--font-sans); color:var(--alarm-critical-light); border-color:var(--alarm-critical-border); background:var(--alarm-critical-bg); }
  .belt-chip-age { font-family:var(--font-sans); color:var(--alarm-warning-light); border-color:var(--alarm-warning-border); background:var(--alarm-warning-bg); }

  /* Diagram */
  .diagram-wrap { background:var(--op-surface-1); border:1px solid var(--op-border-subtle); border-radius:var(--radius-2); padding:14px; margin-bottom:12px; overflow-x:auto; }
  .diagram-svg { width:100%; display:block; min-height:118px; }

  /* Pulley grid */
  .polea-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:10px; }
  .polea-card { background:var(--op-surface-1); border:1px solid var(--op-border-subtle); border-left:3px solid var(--op-border-subtle); border-radius:var(--radius-2); padding:11px 12px; display:flex; flex-direction:column; gap:0; transition:border-color .12s; position:relative; }
  .polea-card:hover { border-color:var(--op-border-strong); }
  .pc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .pc-num { font-size:0.714rem; font-family:var(--font-mono); color:var(--op-text-3); letter-spacing:.04em; }
  .pc-top-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .pc-status { font-size:0.714rem; font-weight:600; display:flex; align-items:center; gap:4px; }
  .pc-type { font-size:0.929rem; font-weight:500; color:var(--op-text-1); margin:5px 0 2px; line-height:1.25; }
  .pc-dias { display:flex; align-items:baseline; gap:5px; margin:6px 0 4px; }
  .pc-dias-val { font-size:1.55rem; font-weight:300; font-variant-numeric:tabular-nums; line-height:1; }
  .pc-dias-unit { font-size:0.714rem; color:var(--op-text-3); }
  .pc-row { font-size:0.786rem; color:var(--op-text-2); display:flex; gap:6px; margin-top:2px; }
  .pc-row .k { color:var(--op-text-3); }
  .pc-codes { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .pc-code { font-size:0.714rem; font-family:var(--font-mono); color:var(--op-text-2); background:var(--op-surface-2); border:1px solid var(--op-border-subtle); padding:1px 6px; border-radius:var(--radius-1); }
  .pc-desc { font-size:0.714rem; color:var(--op-text-3); margin-top:7px; padding-top:7px; border-top:1px solid var(--op-border-subtle); line-height:1.4; }
  .pc-moncon { font-size:0.714rem; color:var(--alarm-diag-light); margin-top:7px; padding:5px 7px; background:var(--alarm-diag-bg); border:1px solid var(--alarm-diag-border); border-radius:var(--radius-1); line-height:1.5; }
  .pc-moncon .k { color:var(--op-text-3); text-transform:uppercase; letter-spacing:.04em; font-size:0.667rem; display:block; margin-bottom:2px; }
  .pc-edit { margin-top:9px; padding:5px 10px; font-size:0.714rem; font-weight:500; background:var(--op-surface-2); border:1px solid var(--op-border-subtle); color:var(--op-text-2); border-radius:var(--radius-1); cursor:pointer; font-family:var(--font-sans); transition:all .12s; display:flex; align-items:center; gap:5px; justify-content:center; }
  .pc-edit:hover { border-color:var(--cmp-blue-500); color:var(--cmp-blue-300); background:var(--cmp-blue-900); }
  .pc-edit:disabled { opacity:.45; cursor:not-allowed; }
  .pc-edit:disabled:hover { border-color:var(--op-border-subtle); color:var(--op-text-2); background:var(--op-surface-2); }
  .pc-modified { font-size:0.667rem; color:var(--cmp-hematita-400); font-weight:500; white-space:nowrap; }

  /* Legend */
  .legend { display:flex; gap:18px; padding:10px 0 0; font-size:0.714rem; color:var(--op-text-3); flex-wrap:wrap; align-items:center; }
  .legend-item { display:flex; align-items:center; gap:5px; }

  /* MODAL */
  .modal-bg { position:fixed; inset:0; background:rgba(15,24,40,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(2px); }
  .modal { background:var(--op-surface-2); border:1px solid var(--op-border-strong); border-radius:var(--radius-3); width:440px; max-width:92vw; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .modal.wide { width:760px; }
  .modal-hdr { background:var(--id-bg); border-bottom:2px solid var(--cmp-hematita-600); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; }
  .modal-title { font-size:0.929rem; font-weight:600; color:#fff; }
  .modal-sub { font-size:0.714rem; color:var(--cmp-blue-300); margin-top:1px; }
  .modal-close { background:transparent; border:none; color:var(--cmp-blue-300); font-size:1.2rem; cursor:pointer; line-height:1; padding:0 4px; }
  .modal-close:hover { color:#fff; }
  .modal-body { padding:18px; display:flex; flex-direction:column; gap:14px; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field-lbl { font-size:0.714rem; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--op-text-3); }
  .field-input { background:var(--op-bg); border:1px solid var(--op-border-strong); border-radius:var(--radius-1); padding:8px 10px; font-family:var(--font-sans); font-size:0.929rem; color:var(--op-text-1); }
  .field-input:focus { outline:none; border-color:var(--cmp-blue-400); }
  .field-input.mono { font-family:var(--font-mono); }
  input[type=date].field-input { font-variant-numeric:tabular-nums; color-scheme:dark; }
  .field-hint { font-size:0.714rem; color:var(--op-text-3); }
  .field-hint.live { color:var(--cmp-blue-300); }
  .modal-foot { padding:14px 18px; border-top:1px solid var(--op-border-subtle); display:flex; gap:8px; align-items:center; }
  .btn { padding:8px 16px; font-size:0.857rem; font-weight:500; border-radius:var(--radius-1); cursor:pointer; font-family:var(--font-sans); border:1px solid transparent; transition:all .12s; }
  .btn-primary { background:var(--cmp-blue-600); color:#fff; border-color:var(--cmp-blue-500); }
  .btn-primary:hover { background:var(--cmp-blue-500); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--op-text-2); border-color:var(--op-border-strong); }
  .btn-ghost:hover { color:var(--op-text-1); border-color:var(--op-text-3); }
  .btn-danger { background:transparent; color:var(--alarm-critical-light); border-color:var(--alarm-critical-border); }
  .btn-danger:hover { background:var(--alarm-critical-bg); }

  /* AUDIT TABLE */
  .audit-table { width:100%; border-collapse:collapse; font-size:var(--fs-nav); }
  .audit-table th { text-align:left; padding:7px 10px; font-size:var(--fs-caps); font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--op-text-3); border-bottom:1px solid var(--op-border-strong); position:sticky; top:0; background:var(--op-surface-2); }
  .audit-table td { padding:7px 10px; border-bottom:1px solid var(--op-border-subtle); color:var(--op-text-2); vertical-align:top; }
  .audit-ts { font-family:var(--font-mono); font-size:0.714rem; color:var(--op-text-3); white-space:nowrap; }
  .audit-user { color:var(--op-text-1); font-weight:500; white-space:nowrap; }
  .audit-accion { display:inline-block; font-size:0.667rem; font-weight:600; padding:1px 7px; border-radius:var(--radius-1); white-space:nowrap; }
  .audit-empty { padding:30px; text-align:center; color:var(--op-text-3); font-size:0.857rem; }

  /* status bar */
  .statusbar { background:var(--op-surface-1); border-top:1px solid var(--op-border-subtle); padding:0 20px; height:26px; display:flex; align-items:center; gap:18px; flex-shrink:0; }
  .sb-item { font-size:0.714rem; color:var(--op-text-3); display:flex; align-items:center; gap:4px; }
  .sb-item a { color:var(--op-text-3); text-decoration:none; }
  .sb-item a:hover { color:var(--op-text-2); }

  /* LOGIN */
  .login-bg { position:fixed; inset:0; background:var(--op-bg); display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { width:380px; max-width:94vw; background:var(--op-surface-1); border:1px solid var(--op-border-subtle); border-radius:var(--radius-3); overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  .login-hdr { background:var(--id-bg); border-bottom:2px solid var(--cmp-hematita-600); padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .login-title { font-size:0.929rem; font-weight:600; color:#fff; text-align:center; }
  .login-sub { font-size:0.714rem; color:var(--cmp-blue-300); text-align:center; }
  .login-body { padding:22px; display:flex; flex-direction:column; gap:14px; }
  .login-err { font-size:0.786rem; color:var(--alarm-critical-light); background:var(--alarm-critical-bg); border:1px solid var(--alarm-critical-border); padding:8px 10px; border-radius:var(--radius-1); }
  .login-mode { font-size:0.714rem; text-align:center; color:var(--op-text-3); padding:4px 10px 0; line-height:1.5; }
  .login-mode b { color:var(--alarm-warning); }
  .loading-bg { position:fixed; inset:0; background:var(--op-bg); display:flex; align-items:center; justify-content:center; color:var(--op-text-3); font-size:0.857rem; }

  /* VISTA TOGGLE (Poleas | Polines) */
  .vista-toggle { display:flex; gap:0; background:var(--op-surface-3); border:1px solid var(--op-border-subtle); border-radius:var(--radius-1); overflow:hidden; }
  .vista-btn { padding:5px 16px; border:none; background:transparent; color:var(--op-text-3); font-family:var(--font-sans); font-size:var(--fs-nav); font-weight:600; cursor:pointer; transition:all .12s; display:flex; align-items:center; gap:6px; letter-spacing:.03em; }
  .vista-btn.active { background:var(--cmp-blue-700); color:#fff; }
  .vista-btn:not(.active):hover { color:var(--op-text-1); background:var(--op-surface-4); }
  .vista-btn:disabled { opacity:.4; cursor:not-allowed; }
  .vista-count { font-size:0.667rem; padding:0 5px; border-radius:8px; background:rgba(255,255,255,0.18); }

  /* HEAT MAP */
  .heat-wrap { background:var(--op-surface-1); border:1px solid var(--op-border-subtle); border-radius:var(--radius-2); padding:12px 14px; margin-bottom:12px; }
  .heat-title { font-size:0.857rem; font-weight:500; color:var(--op-text-1); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .heat-scroll { overflow-x:auto; padding-bottom:4px; }
  .heat-grid { border-collapse:separate; border-spacing:3px; }
  .resumen-th { padding:5px 8px; font-size:0.667rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--op-text-3); background:var(--op-surface-2); white-space:nowrap; text-align:left; border-bottom:1px solid var(--op-border-subtle); }
  .resumen-td { padding:4px 8px; font-size:0.786rem; vertical-align:middle; border-bottom:1px solid var(--op-border-subtle); }
  .heat-grid th.hcol { font-size:0.700rem; font-weight:500; color:var(--op-text-3); font-family:var(--font-mono); writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; height:82px; vertical-align:bottom; padding-bottom:3px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ═══════════════════════════════════════════════════════
   CONFIGURACIÓN SUPABASE
   Pega aquí los 2 valores de tu proyecto (Settings → API).
   Si los dejas vacíos, la app corre en MODO DEMO (datos
   locales en este navegador, sin compartir).
   ═══════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'https://gjrskjsoylozdwnjwwkr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eUmf1bW0JyJW7AvHaU06Cg_tN8-IXQh';   // ← Publishable key (segura para el navegador)

const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
const sb = LIVE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ── Estado de polea ───────────────────────────────────── */
const EST = {
  cambiada: { col:'var(--status-running)', bg:'var(--status-running-bg)', bdr:'var(--status-running-border)', icon:'●', lbl:'CAMBIADA' },
  nunca:    { col:'var(--alarm-critical)', bg:'var(--alarm-critical-bg)', bdr:'var(--alarm-critical-border)', icon:'▲', lbl:'SIN CAMBIO' },
};

/* ── Fechas ─────────────────────────────────────────── */
function parseDMY(s){ if(!s) return null; const [d,m,y]=s.split('-').map(Number); if(!d||!m||!y) return null; return new Date(y,m-1,d); }
function diasDesde(s){ const dt=parseDMY(s); if(!dt) return null; return Math.max(0, Math.floor((Date.now()-dt.getTime())/86400000)); }
function dmyToISO(s){ const dt=parseDMY(s); if(!dt) return ''; return dt.toISOString().slice(0,10); }
function isoToDMY(iso){ if(!iso) return null; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }
function fmtDias(n){ if(n==null) return '—'; if(n>=365){ const a=Math.floor(n/365), d=n%365; return `${a}a ${d}d`; } return `${n}d`; }
function tboVencido(s){ const dt=parseDMY(s); return dt ? dt < new Date() : false; }
function diasHastaTBO(s){ const dt=parseDMY(s); if(!dt) return null; return Math.ceil((dt.getTime()-Date.now())/86400000); }
function estadoPolea(fecha){ return fecha ? 'cambiada' : 'nunca'; }

const okey = (proc,tag,num)=>`${proc}|${tag}|${num}`;
const tkey = (proc,tag)=>`${proc}|${tag}`;

const PROC_META = {
  MAGNETITA:{ label:'Magnetita', dot:'var(--cmp-blue-400)' },
  CNN:      { label:'CNN',       dot:'var(--status-running)' },
  EMBARQUE: { label:'Embarque',  dot:'var(--cmp-hematita-400)' },
};

/* Proceso canónico de cada tag, tomado de la estructura base (poleas + polines).
   Evita que un hallazgo quede bajo el proceso equivocado: p. ej. FS24210 = Correa 10
   Reversible pertenece a MAGNETITA aunque una planilla lo traiga como CNN. */
const TAG_PROC = (()=>{ const m={};
  const add = src => Object.keys(src||{}).forEach(p => Object.keys(src[p]||{}).forEach(t => { if(!(t in m)) m[t]=p; }));
  add(window.POLEAS_DATA); add(window.POLINES_DATA);
  return m; })();
function canonProc(tag, proc){ return TAG_PROC[tag] || proc; }

/* ═══════════════════════════════════════════════════════
   CAPA DE DATOS — Supabase (en línea) o localStorage (demo)
   ═══════════════════════════════════════════════════════ */
const LS_KEY='cmp_poleas_overrides_v1', LS_TBO='cmp_poleas_tbo_v1', LS_AUDIT='cmp_poleas_audit_v1';

async function dbLoadAll(){
  if(!LIVE){
    return {
      overrides: JSON.parse(localStorage.getItem(LS_KEY)||'{}'),
      tbo:       JSON.parse(localStorage.getItem(LS_TBO)||'{}'),
      audit:     JSON.parse(localStorage.getItem(LS_AUDIT)||'[]'),
    };
  }
  const [ov,tb,au] = await Promise.all([
    sb.from('poleas_overrides').select('*'),
    sb.from('tbo_overrides').select('*'),
    sb.from('audit_log').select('*').order('ts',{ascending:false}).limit(500),
  ]);
  const overrides={};
  (ov.data||[]).forEach(r=>{ overrides[okey(r.proc,r.tag,r.num)]={fecha:r.fecha,dias:r.fecha?diasDesde(r.fecha):null,orden:r.orden,aviso:r.aviso,desc:r.descripcion,status:r.fecha?'crit':'none'}; });
  const tbo={};
  (tb.data||[]).forEach(r=>{ tbo[tkey(r.proc,r.tag)]=r.fecha; });
  const audit=(au.data||[]).map(r=>({ts:r.ts,usuario:r.usuario,accion:r.accion,proceso:r.proceso,correa:r.correa,polea:r.polea,detalle:r.detalle}));
  return {overrides,tbo,audit};
}

async function dbSaveOverride(proc,tag,num,fields,user){
  if(!LIVE){
    const m=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    m[okey(proc,tag,num)]=fields; localStorage.setItem(LS_KEY,JSON.stringify(m)); return;
  }
  const { error } = await sb.from('poleas_overrides').upsert({
    proc, tag, num, fecha:fields.fecha, orden:fields.orden, aviso:fields.aviso,
    descripcion:fields.desc, updated_by:user, updated_at:new Date().toISOString()
  });
  if(error) throw error;
}

async function dbSaveTbo(proc,tag,dmy,user){
  if(!LIVE){
    const m=JSON.parse(localStorage.getItem(LS_TBO)||'{}');
    m[tkey(proc,tag)]=dmy; localStorage.setItem(LS_TBO,JSON.stringify(m)); return;
  }
  const { error } = await sb.from('tbo_overrides').upsert({ proc, tag, fecha:dmy, updated_by:user, updated_at:new Date().toISOString() });
  if(error) throw error;
}

async function dbResetTbo(proc,tag){
  if(!LIVE){
    const m=JSON.parse(localStorage.getItem(LS_TBO)||'{}');
    delete m[tkey(proc,tag)]; localStorage.setItem(LS_TBO,JSON.stringify(m)); return;
  }
  const { error } = await sb.from('tbo_overrides').delete().eq('proc',proc).eq('tag',tag);
  if(error) throw error;
}

async function dbAddAudit(entry){
  if(!LIVE){
    const a=JSON.parse(localStorage.getItem(LS_AUDIT)||'[]');
    a.unshift({...entry, ts:new Date().toISOString()});
    localStorage.setItem(LS_AUDIT,JSON.stringify(a.slice(0,500))); return;
  }
  const { error } = await sb.from('audit_log').insert({
    usuario:entry.usuario, accion:entry.accion, proceso:entry.proceso,
    correa:entry.correa, polea:entry.polea, detalle:entry.detalle
  });
  if(error) throw error;
}

/* ── Merge data + overrides ───────────────────────────── */
function mergePolea(proc, tag, p, overrides){
  const ov = overrides[okey(proc,tag,p.num)];
  const merged = ov ? { ...p, ...ov } : { ...p };
  merged._modified = !!ov;
  merged._dias = diasDesde(merged.fecha);
  merged._estado = estadoPolea(merged.fecha);
  return merged;
}

/* ── Diagram ──────────────────────────────────────────── */
/* Tipo de polea -> nombre corto y codigo de 3 letras para el diagrama. */
const TIPO_ABBR = { MOTRIZ:'Motriz', DEFLECTORA:'Deflectora', TENSORA:'Tensora', COLA:'Cola',
                    QUIEBRE:'Quiebre', CONTRAPESO:'Contrapeso', ENVOLVENTE:'Envolvente' };
const TIPO_CODE = { MOTRIZ:'MOT', DEFLECTORA:'DEF', TENSORA:'TEN', COLA:'COL',
                    QUIEBRE:'QUI', CONTRAPESO:'CPE', ENVOLVENTE:'ENV' };
function tipoWord(t){ return (t||'').split(' (')[0].split(' ')[0].toUpperCase(); }
function abbrevTipo(t){ const w=tipoWord(t); return TIPO_ABBR[w] || (w ? w.charAt(0)+w.slice(1).toLowerCase() : ''); }
function codeTipo(t){ const w=tipoWord(t); return TIPO_CODE[w] || w.slice(0,3); }

/* Antiguedad compacta para el diagrama: 15a / 133d. El detalle exacto va en el tooltip. */
function fmtDiasCorto(n){ if(n==null) return ''; if(n>=365) return Math.floor(n/365)+'a'; return n+'d'; }

/* Rueda de polea: aro + pernos de brida + numero al centro. R es adaptable. */
function Wheel({ cx, cy, col, num, R=15, drive }){
  const bolts=6, br=R-4.0, dots=[];
  for(let i=0;i<bolts;i++){ const a=(Math.PI*2*i/bolts)-Math.PI/2;
    dots.push(<circle key={i} cx={+(cx+br*Math.cos(a)).toFixed(1)} cy={+(cy+br*Math.sin(a)).toFixed(1)} r="1.3" fill={col} opacity="0.6"/>); }
  return (
    <g>
      {drive && <circle cx={cx} cy={cy} r={+(R+2.6).toFixed(1)} fill="none" stroke={col} strokeWidth="1.5" opacity="0.55"/>}
      <circle cx={cx} cy={cy} r={R} fill="var(--op-surface-2)" stroke={col} strokeWidth="2.6"/>
      {dots}
      {num!=null && <text x={cx} y={+(cy+R*0.34).toFixed(1)} textAnchor="middle" fontSize={+(R*0.8).toFixed(1)} fontWeight="700" fill={col} fontFamily="IBM Plex Sans">{num}</text>}
    </g>
  );
}

/* Reparte las poleas: en correas planas usa paso constante y centrado (sin huecos
   ni amontonamiento); en correas con desnivel conserva la geometria original. */
function layoutDiag(diag){
  const raw = diag.map(p=>({x:p[0], y:p[1]}));
  const n = raw.length;
  if(!n) return { pos:[], R:15, s:116 };
  const ys = raw.map(p=>p.y);
  const flat = (Math.max.apply(null,ys)-Math.min.apply(null,ys)) <= 2;
  const W=620, M=48, PMAX=116, CY=80;
  let pos, s;
  if(flat && n>1){ const pitch=Math.min((W-2*M)/(n-1), PMAX); const tot=pitch*(n-1); const x0=(W-tot)/2;
    pos=raw.map((_,i)=>({x:x0+i*pitch, y:CY})); s=pitch; }
  else if(n===1){ pos=[{x:W/2, y:CY}]; s=PMAX; }
  else { pos=raw; s=1e9; for(let i=0;i<n-1;i++){ const dx=raw[i+1].x-raw[i].x, dy=raw[i+1].y-raw[i].y; s=Math.min(s, Math.hypot(dx,dy)); } if(s===1e9) s=PMAX; }
  const R = Math.max(9, Math.min(12, Math.round(s*0.28)));
  return { pos, R, s };
}

function Diagram({ correa, poleas }){
  const diag = correa.diag || [];
  const { pos, R, s } = layoutDiag(diag);
  const codeF=+(R*0.6).toFixed(1), metaF=+(R*0.56).toFixed(1), dateF=+(R*0.52).toFixed(1);
  const showFull = s>=78;
  const pts = pos.map(p=>p.x+','+p.y).join(' ');
  let top=1e9, bot=-1e9;
  pos.forEach(pt=>{ const dY=pt.y-R-R*0.5, diaY=pt.y+R+R*0.95+codeF+3.5;
    top=Math.min(top, dY-dateF-2); bot=Math.max(bot, diaY+metaF-1); });
  if(!pos.length){ top=0; bot=120; }
  return (
    <svg className="diagram-svg" viewBox={'0 '+top.toFixed(1)+' 620 '+(bot-top).toFixed(1)} xmlns="http://www.w3.org/2000/svg">
      <polyline points={pts} fill="none" stroke="var(--op-border-strong)" strokeWidth={+(R*0.5).toFixed(1)} strokeLinejoin="round" strokeLinecap="round" opacity="0.26"/>
      <polyline points={pts} fill="none" stroke="var(--op-border-strong)" strokeWidth="1.3" strokeLinejoin="round" opacity="0.5"/>
      {pos.map((pt,idx)=>{
        const p=poleas[idx]; if(!p) return null;
        const e=EST[p._estado];
        const drive=/MOTRIZ/i.test(p.tipo||'');
        const cx=pt.x, cy=pt.y;
        const dateY=cy-R-R*0.5, codeY=cy+R+R*0.95, diasY=codeY+codeF+3.5;
        const dtxt = p.fecha ? (showFull ? p.fecha : (p.fecha.split('-')[1]+'-'+(p.fecha.split('-')[2]||'').slice(2))) : '';
        return (
          <g key={idx}>
            <title>{'Polea N\u00B0'+p.num+' \u00B7 '+(p.tipo||'\u2014')+(p.fecha?' \u00B7 ultimo cambio '+p.fecha:' \u00B7 sin cambio registrado')}</title>
            {p.fecha && <text x={cx} y={+dateY.toFixed(1)} textAnchor="middle" fontSize={dateF} fontWeight="600" fill={e.col} opacity="0.92" fontFamily="IBM Plex Sans">{dtxt}</text>}
            <Wheel cx={cx} cy={cy} col={e.col} num={p.num} R={R} drive={drive}/>
            <text x={cx} y={+codeY.toFixed(1)} textAnchor="middle" fontSize={codeF} fontWeight="700" letterSpacing="0.4" fill="var(--op-text-2)" fontFamily="IBM Plex Sans">{codeTipo(p.tipo)}</text>
            {p._dias!=null && <text x={cx} y={+diasY.toFixed(1)} textAnchor="middle" fontSize={metaF} fill="var(--op-text-3)" fontFamily="IBM Plex Sans">{fmtDiasCorto(p._dias)}</text>}
          </g>
        );
      })}
    </svg>
  );
}

/* ── Pulley card ──────────────────────────────────────── */
function PoleaCard({ p, onEdit, canEdit }){
  const e = EST[p._estado];
  return (
    <div className="polea-card" style={{borderLeftColor:e.col}}>
      <div className="pc-top">
        <span className="pc-num">POLEA N°{p.num}</span>
        <div className="pc-top-right">
          <span className="pc-status" style={{color:e.col}}>{e.icon} {e.lbl}</span>
          {p._modified && <span className="pc-modified">✎ editado</span>}
        </div>
      </div>
      <div className="pc-type">{p.tipo}</div>
      <div className="pc-dias">
        <span className="pc-dias-val" style={{color: p._estado==='nunca'?'var(--alarm-critical)':e.col}}>{p._dias!=null?p._dias:'—'}</span>
        <span className="pc-dias-unit">{p._dias!=null?`días desde el cambio · ${fmtDias(p._dias)}`:'sin fecha registrada'}</span>
      </div>
      <div className="pc-row"><span className="k">Último cambio:</span><span style={{fontVariantNumeric:'tabular-nums'}}>{p.fecha||'Sin registro'}</span></div>
      {(p.orden||p.aviso) && (
        <div className="pc-codes">
          {p.orden && <span className="pc-code">OM {p.orden}</span>}
          {p.aviso && <span className="pc-code">Aviso {p.aviso}</span>}
        </div>
      )}
      {p.desc && <div className="pc-desc">{p.desc}</div>}
      {p.medicion && (
        <div className="pc-moncon">
          <span className="k">■ Última inspección MONCON</span>
          Fecha {p.medicion}{p.medOM?` · OM ${p.medOM}`:''}{p.medEstado?` · ${p.medEstado}`:''}
        </div>
      )}
      <button className="pc-edit" disabled={!canEdit} title={canEdit?'':'Solo lectura'} onClick={()=>onEdit(p)}>
        {canEdit?'✎ Actualizar fecha de cambio':'🔒 Solo lectura'}
      </button>
    </div>
  );
}

/* ── Edit modal ───────────────────────────────────────── */
function EditModal({ proc, tag, correa, polea, onSave, onClear, onClose, busy }){
  const [iso,setIso]=useState(dmyToISO(polea.fecha));
  const [orden,setOrden]=useState(polea.orden||'');
  const [aviso,setAviso]=useState(polea.aviso||'');
  const [desc,setDesc]=useState(polea.desc&&polea.desc!=='Sin cambios registrados'?polea.desc:'');
  const today=new Date().toISOString().slice(0,10);
  const dmy=isoToDMY(iso);
  const dias=dmy?diasDesde(dmy):null;
  const est=dmy?estadoPolea(dmy):'nunca';
  const e=EST[est];

  function guardar(){
    onSave({
      fecha: dmy, dias,
      orden: orden.trim()||null,
      aviso: aviso.trim()||null,
      desc: desc.trim()||'Cambio registrado manualmente',
      status: dmy?'crit':'none',
    });
  }

  return (
    <div className="modal-bg" onMouseDown={(ev)=>{ if(ev.target===ev.currentTarget && !busy) onClose(); }}>
      <div className="modal">
        <div className="modal-hdr">
          <div>
            <div className="modal-title">Polea N°{polea.num} — {polea.tipo}</div>
            <div className="modal-sub">{cleanNombre(correa.nombre)} · TAG {tag} · {PROC_META[proc].label}</div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label className="field-lbl">Fecha del último cambio</label>
            <input type="date" className="field-input" value={iso} max={today} onChange={ev=>setIso(ev.target.value)}/>
            <span className={`field-hint ${dias!=null?'live':''}`}>
              {dias!=null ? `${e.icon} ${e.lbl} — ${dias} días transcurridos (${fmtDias(dias)})` : 'Sin fecha: la polea quedará como “Sin cambio”.'}
            </span>
          </div>
          <div className="field">
            <label className="field-lbl">Orden de mantención (OM)</label>
            <input type="text" className="field-input mono" value={orden} placeholder="Ej. 10888682" onChange={ev=>setOrden(ev.target.value)}/>
          </div>
          <div className="field">
            <label className="field-lbl">N° de aviso</label>
            <input type="text" className="field-input mono" value={aviso} placeholder="Ej. 14387341" onChange={ev=>setAviso(ev.target.value)}/>
          </div>
          <div className="field">
            <label className="field-lbl">Descripción del trabajo</label>
            <input type="text" className="field-input" value={desc} placeholder="Ej. Cambio de polea motriz CT-XX" onChange={ev=>setDesc(ev.target.value)}/>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-primary" disabled={busy} onClick={guardar}>{busy?'Guardando…':'Guardar cambio'}</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          {polea.fecha && <button className="btn btn-danger" disabled={busy} style={{marginLeft:'auto'}} onClick={onClear}>Limpiar registro</button>}
        </div>
      </div>

   POLINES — criticidad, datos y vista (mapa de calor)
   ═══════════════════════════════════════════════════════ */
const POLINES = window.POLINES_DATA || {MAGNETITA:{},CNN:{},EMBARQUE:{}};

const CRIT = {
  'Baja':             { col:'#52A06C', rank:1, icon:'●' },
  'Media':            { col:'#C8B828', rank:2, icon:'◆' },
  'Alta':             { col:'#D97C30', rank:3, icon:'▲' },
  'Muy Alta':         { col:'#D94040', rank:4, icon:'▲' },
  'Mantención Mayor': { col:'#9B5DE0', rank:5, icon:'■' },
};
const CRIT_ORDER = ['Muy Alta','Alta','Media','Baja','Mantención Mayor'];
function critOf(s){ return CRIT[s] || { col:'var(--op-text-3)', rank:0, icon:'○' }; }
function critBg(s){ const c=critOf(s); return c.col+'26'; }   // ~15% alpha

/* Limpia nombres de correa: quita el paréntesis tipo "(CT06)" para estandarizar */
function cleanNombre(s){ return (s==null?'':s).toString().replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim(); }
/* Etiqueta amigable: los tags FSxxxxx-N (alimentadores) se muestran como "Feeder NN SUB".
   La familia FS define el subproceso: 23455→MAG · 24491→CNN · 25455→CU */
const FEED_SUB = { '23455':{ab:'MAG',rank:1}, '24491':{ab:'CNN',rank:2}, '25455':{ab:'CU',rank:3} };
function beltLabel(tag){
  const m=String(tag).match(/^FS(\d+)-(\d+)$/);
  if(m){ const fam=FEED_SUB[m[1]]; const num=String(+m[2]).padStart(2,'0');
    return { nombre:'Feeder '+num+(fam?' '+fam.ab:''), isFeeder:true, feedRank:(fam?fam.rank:9)*100+(+m[2]) }; }
  return { nombre:cleanNombre(tag), isFeeder:false, feedRank:0 };
}
/* Lista de correas por proceso = unión de poleas + polines (base + importados).
   Orden: correas primero; los alimentadores (Feeder) van después, agrupados por subproceso. */
function beltsFor(proc, adds){
  const out=[]; const seen={};
  Object.keys(window.POLEAS_DATA[proc]||{}).forEach(t=>{ seen[t]=1; out.push({tag:t, nombre:cleanNombre(window.POLEAS_DATA[proc][t].nombre), hasPoleas:true, hasPolines:!!(POLINES[proc]&&POLINES[proc][t]), isFeeder:false, feedRank:0}); });
  Object.keys(POLINES[proc]||{}).forEach(t=>{ if(!seen[t]){ seen[t]=1; const L=beltLabel(t); out.push({tag:t, nombre:L.nombre, hasPoleas:false, hasPolines:true, isFeeder:L.isFeeder, feedRank:L.feedRank}); } });
  (adds||[]).forEach(a=>{ if(a.proc===proc && !seen[a.tag]){ seen[a.tag]=1; const L=beltLabel(a.tag); out.push({tag:a.tag, nombre:L.nombre, hasPoleas:false, hasPolines:true, isFeeder:L.isFeeder, feedRank:L.feedRank}); } });
  const reg=out.filter(b=>!b.isFeeder);
  const fee=out.filter(b=>b.isFeeder).sort((a,b)=> a.feedRank-b.feedRank || a.tag.localeCompare(b.tag,'es',{numeric:true}));
  return [...reg, ...fee];
}

/* ── Importador de Excel (mismo formato de planilla CMP) ── */
function normTxt(s){ return (s==null?'':s).toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function areaToProc(v){ const s=(v==null?'':v).toString().toUpperCase(); if(s.includes('MAGNETITA'))return 'MAGNETITA'; if(s.includes('CNN'))return 'CNN'; if(s.includes('EMBARQUE'))return 'EMBARQUE'; return null; }
function normCrit(v){ const s=normTxt(v); if(!s)return null; if(s.startsWith('baja'))return 'Baja'; if(s.startsWith('media'))return 'Media'; if(s.startsWith('muy alta'))return 'Muy Alta'; if(s.startsWith('alta'))return 'Alta'; if(s.includes('mant'))return 'Mantención Mayor'; return null; }
function xlsToDMY(v){ if(v==null||v==='')return null; const pad=n=>String(n).padStart(2,'0'); if(v instanceof Date)return `${pad(v.getDate())}-${pad(v.getMonth()+1)}-${v.getFullYear()}`; if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`; } const s=String(v).trim(); const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if(m){ let y=m[3]; if(y.length===2)y='20'+y; return `${pad(+m[1])}-${pad(+m[2])}-${y}`; } return s; }
/* Identidad de un hallazgo de polín: NO incluye fecha (la fecha de inspección cambia
   entre planillas para el mismo hallazgo). Se ancla en aviso SAP + posición + condición. */
function polKey(h){ return [h.proc,h.tag,h.npolin,normTxt(h.ident),normTxt(h.pos),normTxt(h.cond),h.crit,(h.aviso||'').toString().trim()].join('|'); }
const COLMAP = { fecha:['fecha'], area:['area'], equipo:['equipo'], npolin:['n polin','no polin','npolin'], ident:['identificacion polin','identificacion'], pos:['posicion polin','posicion'], cond:['condicion'], accion:['accion'], prog:['programacion'], crit:['criticidad'], aviso:['n aviso','no aviso','aviso'], estCond:['estado condicion'], estAviso:['estado aviso sap','estado aviso'], obs:['observaciones','observacion'] };
function parseExcelPolines(aoa){
  // localizar fila de encabezados (debe contener 'equipo' y 'criticidad')
  let hdrIdx=-1, colIdx={};
  for(let r=0;r<Math.min(aoa.length,15);r++){
    const row=aoa[r]||[]; const map={}; let hits=0;
    row.forEach((cell,ci)=>{ const n=normTxt(cell); for(const key in COLMAP){ if(COLMAP[key].includes(n)){ map[key]=ci; hits++; } } });
    if(map.equipo!=null && map.crit!=null){ hdrIdx=r; colIdx=map; break; }
    if(hits>=4 && hdrIdx<0){ hdrIdx=r; colIdx=map; }
  }
  if(hdrIdx<0) return { error:'No se encontraron los encabezados esperados (Equipo, Criticidad, etc.). Verifica que el archivo tenga el mismo formato de la planilla original.' };
  const get=(row,key)=> colIdx[key]!=null ? row[colIdx[key]] : '';
  const valid=[], warns=[]; let skipped=0;
  for(let r=hdrIdx+1;r<aoa.length;r++){
    const row=aoa[r]||[]; if(row.every(c=>c==null||String(c).trim()===''))continue;
    const equipo=(get(row,'equipo')||'').toString().trim().toUpperCase();
    let proc=areaToProc(get(row,'area')); if(TAG_PROC[equipo]) proc=TAG_PROC[equipo];
    const crit=normCrit(get(row,'crit'));
    if(!equipo){ skipped++; continue; }
    if(!proc){ warns.push(`Fila ${r+1}: área no reconocida (“${get(row,'area')}”) — omitida`); skipped++; continue; }
    if(!crit){ warns.push(`Fila ${r+1}: criticidad no reconocida (“${get(row,'crit')}”) — se usa “Media”`); }
    valid.push({ proc, tag:equipo, fecha:xlsToDMY(get(row,'fecha')), npolin:(get(row,'npolin')||'').toString().trim()||null,
      ident:(get(row,'ident')||'').toString().trim()||null, pos:(get(row,'pos')||'').toString().trim()||null,
      cond:(get(row,'cond')||'').toString().trim()||null, accion:(get(row,'accion')||'').toString().trim()||null,
      prog:(get(row,'prog')||'').toString().trim()||null, crit:crit||'Media', aviso:(get(row,'aviso')||'').toString().trim()||null,
      estCond:(get(row,'estCond')||'').toString().trim()||'Activo', obs:(get(row,'obs')||'').toString().trim()||null });
  }
  return { valid, warns, skipped };
}

/* Hallazgos combinados de una correa: baseline (Excel) + agregados.
   Un registro de BD (extra) supersede a su copia base con la misma identidad (mismo polKey),
   de modo que un cambio de estado importado (Activo→No Activo) reemplaza al histórico semilla. */
function hallazgosDe(proc, tag, adds){
  const base=((POLINES[proc]||{})[tag]||[]).map((h,i)=>({...h, id:`base|${proc}|${tag}|${i}`, _added:false}));
  const extraAll=adds.filter(a=>a.proc===proc && a.tag===tag);
  // dedup de registros BD por identidad: conserva el más reciente (adds viene ordenado desc por created_at)
  const seenExtra=new Set(); const extra=[];
  extraAll.forEach(h=>{ const k=polKey(h); if(!seenExtra.has(k)){ seenExtra.add(k); extra.push(h); } });
  const baseVivos=base.filter(h=>!seenExtra.has(polKey({...h,proc,tag})));
  return [...extra, ...baseVivos];
}
function dmyKey(s){ if(!s) return 0; const [d,m,y]=s.split('-').map(Number); return (y*10000)+(m*100)+d; }

/* ── Heat map (criticidad × inspección) ───────────────── */
function HeatMap({ hallazgos }){
  // agrupar por fecha
  const byDate={};
  hallazgos.forEach(h=>{ const f=h.fecha||'s/f'; (byDate[f]=byDate[f]||[]).push(h); });
  const fechas=Object.keys(byDate).sort((a,b)=>dmyKey(a)-dmyKey(b));
  if(fechas.length===0) return null;
  // max count para escalar opacidad
  let maxC=1;
  fechas.forEach(f=>CRIT_ORDER.forEach(c=>{ const n=byDate[f].filter(h=>h.crit===c).length; if(n>maxC)maxC=n; }));
  return (
    <div className="heat-wrap">
      <div className="heat-title">
        <span>Mapa de calor — criticidad por inspección</span>
        <span style={{fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:400}}>{fechas.length} inspecciones · más reciente a la derecha →</span>
      </div>
      <div className="heat-scroll">
        <table className="heat-grid">
          <thead>
            <tr>
              <th></th>
              {fechas.map(f=><th key={f} className="hcol">{f}</th>)}
            </tr>
          </thead>
          <tbody>
            {CRIT_ORDER.map(c=>{
              const cc=critOf(c);
              const anyInRow=fechas.some(f=>byDate[f].some(h=>h.crit===c));
              if(!anyInRow) return null;
              return (
                <tr key={c}>
                  <th className="hrow"><span style={{color:cc.col}}>{cc.icon}</span> {c}</th>
                  {fechas.map(f=>{
                    const n=byDate[f].filter(h=>h.crit===c).length;
                    const op=n?(0.22+0.78*(n/maxC)):0;
                    return <td key={f}><div className="heat-cell" style={{background:n?cc.col:'var(--op-surface-2)', opacity:n?1:.5, color:n?'#fff':'var(--op-text-3)', boxShadow:n?`inset 0 0 0 99px ${cc.col}${Math.round(op*255).toString(16).padStart(2,'0')}`:'none'}}>{n||'·'}</div></td>;
                  })}
                </tr>
              );
            })}
            <tr>
              <th className="hrow" style={{color:'var(--op-text-1)',fontWeight:600}}>Total</th>
              {fechas.map(f=><td key={f}><div className="heat-cell tot">{byDate[f].length}</div></td>)}
            </tr>
          </tbody>
        </table>
      </div>
      <div className="heat-legend">
        {CRIT_ORDER.map(c=>{ const cc=critOf(c); return <span key={c} className="heat-li"><span className="heat-sw" style={{background:cc.col}}></span>{cc.icon} {c}</span>; })}
        <span className="heat-li" style={{marginLeft:'auto'}}>Color = criticidad · Intensidad = cantidad de hallazgos</span>
      </div>
    </div>
  );
}

/* ── Vista de polines completa ────────────────────────── */
function PolinesView({ proc, tag, beltNombre, hallazgos, canEdit, onAdd, onImport, onDelete }){

        <div className="kpi"><div className="kpi-lbl">Última Inspección</div><div className="kpi-val" style={{fontSize:'1.3rem',fontVariantNumeric:'tabular-nums'}}>{ultima}</div><div className="kpi-sub">{fechas.length} inspecciones registradas</div></div>

      <div className="belt-hdr">

      {/* Barra resumen por criticidad */}
      {total>0 && (
        <div className="heat-wrap" style={{paddingBottom:10}}>
          <div className="heat-title"><span>Resumen de criticidad — {beltNombre}</span></div>
          <div className="crit-bar">
            {CRIT_ORDER.map(c=>{ const n=counts[c]; if(!n)return null; const cc=critOf(c); return <div key={c} className="crit-seg" style={{background:cc.col, flex:n}} title={`${c}: ${n}`}>{n}</div>; })}
          </div>
          <div className="heat-legend" style={{borderTop:'none',paddingTop:6}}>
            {CRIT_ORDER.map(c=>counts[c]>0 && <span key={c} className="heat-li"><span className="heat-sw" style={{background:critOf(c).col}}></span>{critOf(c).icon} {c}: <b style={{color:'var(--op-text-2)'}}>{counts[c]}</b></span>)}
          </div>
        </div>
      )}

      {/* Mapa de calor por inspección — reacciona al filtro seleccionado */}
      <HeatMap hallazgos={rows}/>

      {/* Tabla de hallazgos */}
      <div className="pol-toolbar">
        <span style={{fontSize:'0.857rem',fontWeight:500,color:'var(--op-text-1)'}}>Histórico Polines</span>
        <div className="pol-filter">
          {[['todos','Todos'],['activos','Activos'],['criticos','Críticos']].map(([k,l])=>(
            <button key={k} className={`pol-fbtn${filtro===k?' active':''}`} onClick={()=>setFiltro(k)}>{l}</button>
          ))}
        </div>
        <span style={{marginLeft:'auto',fontSize:'0.714rem',color:'var(--op-text-3)'}}>{rows.length} de {total} hallazgos</span>
      </div>
      <div className="pol-table-wrap">
        <table className="pol-table">
          <thead>
            <tr>
              <th>Fecha</th><th>N°</th><th>Identificación</th><th>Posición</th><th>Condición</th><th>Acción</th><th>Program.</th><th>Criticidad</th><th>Aviso</th><th>Estado</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(h=>{
              const cc=critOf(h.crit);
              const act=h.estCond==='Activo';
              return (
                <tr key={h.id} style={h._added?{background:'rgba(38,77,140,0.10)'}:{}}>
                  <td className="audit-ts">{h.fecha||'—'}{h._added&&<span style={{color:'var(--cmp-blue-300)'}}> ✎</span>}</td>
                  <td style={{fontFamily:'var(--font-mono)',color:'var(--op-text-3)'}}>{h.npolin||'—'}</td>
                  <td style={{maxWidth:160}}>{h.ident||'—'}</td>
                  <td>{h.pos||'—'}</td>
                  <td style={{maxWidth:150,color:'var(--op-text-1)'}}>{h.cond||'—'}</td>
                  <td>{h.accion||'—'}</td>
                  <td style={{whiteSpace:'nowrap'}}>{h.prog||'—'}</td>
                  <td><span className="pol-crit" style={{color:cc.col,background:critBg(h.crit),border:`1px solid ${cc.col}55`}}>{cc.icon} {h.crit||'—'}</span></td>
                  <td style={{fontFamily:'var(--font-mono)',fontSize:'0.714rem',color:'var(--op-text-3)'}}>{h.aviso||'—'}</td>
                  <td><span className="pol-estado" style={act?{color:'var(--alarm-major-light)',background:'var(--alarm-major-bg)',border:'1px solid var(--alarm-major-border)'}:{color:'var(--op-text-3)',background:'var(--op-surface-3)',border:'1px solid var(--op-border-subtle)'}}>{act?'● Activo':'○ No activo'}</span></td>
                </tr>
              );
            })}
            {rows.length===0 && <tr><td colSpan={canEdit?11:10} style={{textAlign:'center',padding:24,color:'var(--op-text-3)'}}>Sin hallazgos para este filtro.</td></tr>}
          </tbody>
        </table>
      </div>
    </>
  );
}

/* ── Modal registrar hallazgo de polín ────────────────── */
function PolinModal({ proc, tag, beltNombre, selectable, polAdds, onSave, onClose, busy }){
  const today=new Date().toISOString().slice(0,10);
  const [selProc,setSelProc]=useState(proc||Object.keys(PROC_META)[0]);
  const beltOpts=useMemo(()=>beltsFor(selProc, polAdds||[]),[selProc, polAdds]);
  const [selTag,setSelTag]=useState(tag||(beltOpts[0]&&beltOpts[0].tag));
  useEffect(()=>{ if(selectable && beltOpts.length && !beltOpts.some(b=>b.tag===selTag)) setSelTag(beltOpts[0].tag); },[selProc]);
  const effProc = selectable ? selProc : proc;
  const effTag = selectable ? selTag : tag;
  const effNombre = selectable ? (beltOpts.find(b=>b.tag===selTag)?.nombre||selTag) : beltNombre;
  const [iso,setIso]=useState(today);
  const [npolin,setNpolin]=useState('');
  const [ident,setIdent]=useState('');
  const [pos,setPos]=useState('Izquierdo');
  const [cond,setCond]=useState('');
  const [accion,setAccion]=useState('Cambiar');
  const [prog,setProg]=useState('2 Semanas');
  const [crit,setCrit]=useState('Baja');
  const [aviso,setAviso]=useState('');
  const [obs,setObs]=useState('');
  function guardar(){
    onSave({ proc:effProc, tag:effTag, fecha:isoToDMY(iso), npolin:npolin.trim()||null, ident:ident.trim()||null, pos,
      cond:cond.trim()||null, accion, prog, crit, aviso:aviso.trim()||null, estCond:'Activo', obs:obs.trim()||null });
  }
  const inp=(v,set,ph,mono)=> <input className={`field-input${mono?' mono':''}`} value={v} placeholder={ph} onChange={e=>set(e.target.value)}/>;
  const sel=(v,set,opts)=> <select className="field-input" value={v} onChange={e=>set(e.target.value)} style={{colorScheme:'dark'}}>{opts.map(o=><option key={o} value={o}>{o}</option>)}</select>;
  return (
    <div className="modal-bg" onMouseDown={(ev)=>{ if(ev.target===ev.currentTarget && !busy) onClose(); }}>
      <div className="modal wide">
        <div className="modal-hdr">
          <div>
            <div className="modal-title">Registrar hallazgo de polín</div>
            <div className="modal-sub">{selectable ? `${PROC_META[effProc].label} · ${effNombre} · TAG ${effTag}` : `${beltNombre} · TAG ${tag} · ${PROC_META[proc].label}`}</div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          {selectable && <div className="field"><label className="field-lbl">Proceso</label>{sel(selProc,setSelProc,Object.keys(PROC_META))}<span className="field-hint">{PROC_META[selProc].label}</span></div>}
          {selectable && <div className="field"><label className="field-lbl">Correa / Feeder</label><select className="field-input" value={selTag} onChange={e=>setSelTag(e.target.value)} style={{colorScheme:'dark'}}>{beltOpts.map(b=><option key={b.tag} value={b.tag}>{b.nombre} — {b.tag}</option>)}</select></div>}
          <div className="field"><label className="field-lbl">Fecha de inspección</label><input type="date" className="field-input" value={iso} max={today} onChange={e=>setIso(e.target.value)}/></div>
          <div className="field"><label className="field-lbl">Criticidad</label>{sel(crit,setCrit,['Baja','Media','Alta','Muy Alta','Mantención Mayor'])}<span className="field-hint" style={{color:critOf(crit).col}}>{critOf(crit).icon} {crit}</span></div>
          <div className="field"><label className="field-lbl">N° Polín</label>{inp(npolin,setNpolin,'Ej. 46',true)}</div>
          <div className="field"><label className="field-lbl">Posición</label>{sel(pos,setPos,['Izquierdo','Derecho','Centro','Ambos','Retorno','Completo'])}</div>
          <div className="field" style={{gridColumn:'span 2'}}><label className="field-lbl">Identificación del polín</label>{inp(ident,setIdent,'Ej. Estación retorno autoalineantes')}</div>
          <div className="field" style={{gridColumn:'span 2'}}><label className="field-lbl">Condición detectada</label>{inp(cond,setCond,'Ej. Rodillo vela gastado')}</div>
          <div className="field"><label className="field-lbl">Acción</label>{sel(accion,setAccion,['Cambiar','Reponer','Reparar','Monitorear'])}</div>
          <div className="field"><label className="field-lbl">Programación</label>{sel(prog,setProg,['24 horas','1 Semana','2 Semanas','+ 4 Semanas'])}</div>
          <div className="field"><label className="field-lbl">N° Aviso SAP</label>{inp(aviso,setAviso,'Ej. 15828535',true)}</div>
          <div className="field"><label className="field-lbl">Observaciones</label>{inp(obs,setObs,'Opcional')}</div>

/* ── Modal: importar Excel de polines ─────────────────── */
function ImportModal({ existing, onImport, onClose, busy }){
  const [parsed,setParsed]=useState(null);   // {valid,warns,skipped}
  const [error,setError]=useState('');
  const [fileName,setFileName]=useState('');
  const [omitDup,setOmitDup]=useState(true);
  const [parsing,setParsing]=useState(false);
  const inputRef=React.useRef(null);

  function handleFile(file){
    if(!file) return;
    if(!window.XLSX){ setError('No se pudo cargar el lector de Excel (XLSX). Revisa tu conexión.'); return; }
    setError(''); setFileName(file.name); setParsing(true); setParsed(null);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const res=parseExcelPolines(aoa);
        if(res.error){ setError(res.error); setParsing(false); return; }
        // clasificar: nuevo / actualización de estado / duplicado exacto
        res.valid.forEach(h=>{
          const ex = existing.get(polKey(h));
          if(ex){
            if((ex.estCond||'Activo') === (h.estCond||'Activo')){ h._dup = true; }
            else if(ex.src==='db'){ h._update = true; h._updateId = ex.id; h._prevEst = ex.estCond||'Activo'; }
            else { /* base: se inserta fila BD que supersede al histórico semilla */ h._supersede = true; h._prevEst = ex.estCond||'Activo'; }
          }
        });
        setParsed(res); setParsing(false);
      }catch(e){ setError('No se pudo leer el archivo: '+(e.message||e)); setParsing(false); }
    };
    reader.onerror=()=>{ setError('No se pudo leer el archivo.'); setParsing(false); };
    reader.readAsArrayBuffer(file);
  }

  const dupCount = parsed ? parsed.valid.filter(h=>h._dup).length : 0;
  const updateCount = parsed ? parsed.valid.filter(h=>h._update).length : 0;
  const supersedeCount = parsed ? parsed.valid.filter(h=>h._supersede).length : 0;
  const estadoChanges = updateCount + supersedeCount;
  const toImport = parsed ? (omitDup ? parsed.valid.filter(h=>!h._dup && !h._update) : parsed.valid.filter(h=>!h._update)) : [];
  const nuevosReales = toImport.filter(h=>!h._supersede).length;
  const updates = parsed ? parsed.valid.filter(h=>h._update).map(h=>({id:h._updateId, estCond:h.estCond||'Activo'})) : [];
  // breakdown por proceso (solo nuevos reales)
  const byProc={}; toImport.filter(h=>!h._supersede).forEach(h=>byProc[h.proc]=(byProc[h.proc]||0)+1);
  const fechas=parsed?[...new Set(parsed.valid.map(h=>h.fecha).filter(Boolean))]:[];

  function confirmar(){
    const summary=Object.keys(byProc).map(p=>`${PROC_META[p]?.label||p}: ${byProc[p]}`).join(' · ')||'sin nuevos';
    onImport(toImport, { fileName, summary, fechas, nuevosReales, estadoChanges }, updates);
  }

  return (
    <div className="modal-bg" onMouseDown={(e)=>{ if(e.target===e.currentTarget && !busy) onClose(); }}>
      <div className="modal wide">
        <div className="modal-hdr">
          <div>
            <div className="modal-title">Importar inspección desde Excel</div>
            <div className="modal-sub">Carga masiva de hallazgos de polines · mismo formato de la planilla CMP</div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {/* Dropzone / selector */}
          <div onClick={()=>inputRef.current && inputRef.current.click()}
            onDragOver={e=>{e.preventDefault();}} onDrop={e=>{e.preventDefault(); handleFile(e.dataTransfer.files[0]);}}
            style={{border:'1.5px dashed var(--op-border-strong)',borderRadius:'var(--radius-2)',padding:'22px',textAlign:'center',cursor:'pointer',background:'var(--op-bg)'}}>
            <div style={{fontSize:'1.4rem',marginBottom:6}}>⬆</div>
            <div style={{fontSize:'0.857rem',color:'var(--op-text-1)',fontWeight:500}}>{fileName||'Haz clic o arrastra aquí tu archivo .xlsx'}</div>
            <div style={{fontSize:'0.714rem',color:'var(--op-text-3)',marginTop:4}}>Columnas esperadas: Fecha · Área · Equipo · N° Polín · Identificación · Posición · Condición · Acción · Programación · Criticidad · N° Aviso · Estado Condición · Observaciones</div>
            <input ref={inputRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>

          {parsing && <div style={{fontSize:'0.857rem',color:'var(--op-text-2)'}}>Leyendo archivo…</div>}
          {error && <div className="login-err">{error}</div>}

          {parsed && (
            <>
              {/* Resumen */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
                <div className="kpi" style={{borderTopColor:'var(--cmp-blue-500)'}}><div className="kpi-lbl">Filas válidas</div><div className="kpi-val">{parsed.valid.length}</div></div>
                <div className="kpi" style={{borderTopColor:'var(--status-running)'}}><div className="kpi-lbl">Nuevos a importar</div><div className="kpi-val" style={{color:'var(--status-running-light)'}}>{nuevosReales}</div></div>
                <div className="kpi" style={{borderTopColor: estadoChanges>0?'var(--cmp-blue-400)':'var(--op-border-subtle)'}}><div className="kpi-lbl">Cambios de estado</div><div className="kpi-val" style={{color:estadoChanges>0?'var(--cmp-blue-300)':'var(--op-text-1)'}}>{estadoChanges}</div></div>
                <div className="kpi" style={{borderTopColor: dupCount>0?'var(--alarm-warning)':'var(--op-border-subtle)'}}><div className="kpi-lbl">Duplicados</div><div className="kpi-val" style={{color:dupCount>0?'var(--alarm-warning-light)':'var(--op-text-1)'}}>{dupCount}</div></div>
                <div className="kpi"><div className="kpi-lbl">Omitidas</div><div className="kpi-val">{parsed.skipped}</div></div>
              </div>
              {estadoChanges>0 && <div style={{fontSize:'0.786rem',color:'var(--cmp-blue-300)',background:'rgba(43,111,219,.10)',border:'1px solid rgba(43,111,219,.3)',borderRadius:'var(--radius-1)',padding:'7px 11px'}}>↻ {estadoChanges} hallazgo{estadoChanges!==1?'s':''} existente{estadoChanges!==1?'s':''} cambiará{estadoChanges!==1?'n':''} de estado (ej. Activo → No Activo) y dejará{estadoChanges!==1?'n':''} de aparecer en Críticos Polines.</div>}
              {/* Por proceso + fechas */}
              <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:'0.786rem',color:'var(--op-text-2)'}}>
                <div><b style={{color:'var(--op-text-3)',fontSize:'0.667rem',textTransform:'uppercase',letterSpacing:'.05em'}}>Por proceso</b><br/>{Object.keys(byProc).length?Object.keys(byProc).map(p=>`${PROC_META[p]?.label||p}: ${byProc[p]}`).join(' · '):'—'}</div>
                <div><b style={{color:'var(--op-text-3)',fontSize:'0.667rem',textTransform:'uppercase',letterSpacing:'.05em'}}>Fecha(s) de inspección</b><br/>{fechas.length?fechas.join(' · '):'—'}</div>
              </div>
              {/* Opción duplicados */}
              {dupCount>0 && (
                <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'0.786rem',color:'var(--op-text-2)',cursor:'pointer'}}>
                  <input type="checkbox" checked={omitDup} onChange={e=>setOmitDup(e.target.checked)} style={{width:16,height:16}}/>
                  Omitir {dupCount} hallazgo(s) que ya existen (mismo polín, fecha, condición y criticidad)
                </label>
              )}
              {/* Advertencias */}
              {parsed.warns.length>0 && (
                <div style={{maxHeight:120,overflowY:'auto',background:'var(--alarm-warning-bg)',border:'1px solid var(--alarm-warning-border)',borderRadius:'var(--radius-1)',padding:'8px 10px'}}>
                  <div style={{fontSize:'0.714rem',fontWeight:600,color:'var(--alarm-warning-light)',marginBottom:4}}>⚠ {parsed.warns.length} advertencia(s)</div>
                  {parsed.warns.slice(0,12).map((w,i)=><div key={i} style={{fontSize:'0.714rem',color:'var(--op-text-2)'}}>{w}</div>)}
                  {parsed.warns.length>12 && <div style={{fontSize:'0.714rem',color:'var(--op-text-3)'}}>… y {parsed.warns.length-12} más</div>}
                </div>
              )}
              <div style={{fontSize:'0.714rem',color:'var(--op-text-3)'}}>Cada importación se suma como una nueva inspección (queda registrada en el historial y aparece como columna nueva en el mapa de calor). No reemplaza los datos existentes.</div>
            </>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn btn-primary" disabled={busy||!parsed||(toImport.length===0&&updates.length===0)} onClick={confirmar}>{busy?'Procesando…':(()=>{ const parts=[]; if(nuevosReales>0)parts.push(`Importar ${nuevosReales}`); if(estadoChanges>0)parts.push(`actualizar ${estadoChanges}`); return parts.length?parts.join(' y '):'Sin cambios'; })()}</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

        ...filtered.map(h=>[

          PROC_META[h.proc]?.label||h.proc,
          h.npolin||'',
          h.ident||'',
          h.pos||'',
          h.cond||'',
          h.accion||'',
          h.prog||'',
          h.crit||'',
          h.aviso||'',
          h.fecha||''
        ])
      ];
      const ws2=XLSX.utils.aoa_to_sheet(detData);
      ws2['!cols']=[{wch:32},{wch:18},{wch:10},{wch:22},{wch:20},{wch:25},{wch:25},{wch:18},{wch:12},{wch:14},{wch:14}];
      XLSX.utils.book_append_sheet(wb,ws2,'Detalle Hallazgos');
      const hoy=new Date().toLocaleDateString('es-CL').replace(/\//g,'-');
      XLSX.writeFile(wb,`Criticos Activos CMP ${hoy}.xlsx`);
    }catch(e){ alert('Error al exportar: '+e.message); }
    setExporting(false);
  }

  function exportPDF(){
    const hoy=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
    const procLabel=filtroProc==='todos'?'Todos los procesos':PROC_META[filtroProc]?.label||filtroProc;
    const heatHtml=heatFiltered.map(r=>{
      const tot=Object.values(r.counts).reduce((s,n)=>s+n,0);
      return `<tr><td>${r.nombre}</td><td>${PROC_META[r.proc]?.label||r.proc}</td><td style="text-align:center;color:#b91c1c;font-weight:700">${r.counts['Muy Alta']||'—'}</td><td style="text-align:center;color:#c2410c;font-weight:700">${r.counts['Alta']||'—'}</td><td style="text-align:center;font-weight:700">${tot}</td><td>${r.ultima||'—'}</td></tr>`;
    }).join('');
    const detHtml=filtered.map((h,i)=>{
      const cr=critOf(h.crit);
      return `<tr style="background:${i%2===0?'#f7f7f7':'#fff'}"><td>${h.beltNombre}</td><td>${PROC_META[h.proc]?.label||h.proc}</td><td style="text-align:center">${h.npolin||'—'}</td><td>${h.ident||'—'}</td><td>${h.pos||'—'}</td><td>${h.cond||'—'}</td><td>${h.accion||'—'}</td><td style="color:${cr.col};font-weight:700">${h.crit}</td><td>${h.aviso||'—'}</td><td>${h.fecha||'—'}</td></tr>`;
    }).join('');
    const kpiBoxes=Object.keys(PROC_META).map(p=>{
      const n=allCriticos.filter(h=>h.proc===p).length;
      return n>0?`<div class="kb"><div class="kn">${n}</div><div class="kl">${PROC_META[p].label}</div></div>`:'';
    }).join('');
    const win=window.open('','_blank','width=1100,height=850');
    if(!win){ alert('Permite las ventanas emergentes para exportar PDF'); return; }
    win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reporte Críticos CMP ${hoy}</title>
    <style>body{font-family:Arial,sans-serif;font-size:11px;color:#111;margin:24px;background:#fff}
    h1{font-size:15px;margin:0 0 3px;color:#071840}h2{font-size:11px;margin:16px 0 5px;color:#071840;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #071840;padding-bottom:3px}
    .sub{font-size:10px;color:#555;margin-bottom:14px}.kpi-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .kb{border:1px solid #ccc;border-radius:3px;padding:6px 12px;text-align:center;min-width:90px}.kn{font-size:20px;font-weight:700;color:#071840}.kl{font-size:9px;color:#666;margin-top:1px}
    table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:10px}th{background:#071840;color:#fff;padding:4px 7px;text-align:left;font-size:9px;letter-spacing:.04em}
    td{padding:3px 7px;border-bottom:1px solid #e5e5e5;vertical-align:middle}.footer{text-align:right;font-size:9px;color:#aaa;margin-top:12px}
    @media print{body{margin:8px}}</style></head><body>
    <h1>🔴 Reporte Críticos Activos — Polines CMP</h1>
    <div class="sub">Proceso: ${procLabel} &nbsp;|&nbsp; Generado: ${hoy} &nbsp;|&nbsp; Total hallazgos: ${filtered.length}</div>
    <div class="kpi-row"><div class="kb"><div class="kn" style="color:#b91c1c">${total}</div><div class="kl">Críticos activos</div></div><div class="kb"><div class="kn">${heatRows.length}</div><div class="kl">Correas afectadas</div></div>${kpiBoxes}</div>
    <h2>Mapa de Calor por Correa</h2>
    <table><thead><tr><th>Correa / Feeder</th><th>Proceso</th><th>Muy Alta</th><th>Alta</th><th>Total</th><th>Últ. Insp.</th></tr></thead><tbody>${heatHtml}</tbody></table>
    <h2>Detalle de Hallazgos Críticos Activos</h2>
    <table><thead><tr><th>Correa / Feeder</th><th>Proceso</th><th>N° Polín</th><th>Identificación</th><th>Posición</th><th>Condición</th><th>Acción</th><th>Criticidad</th><th>N° Aviso</th><th>Fecha</th></tr></thead><tbody>${detHtml}</tbody></table>
    <div class="footer">CMP — Gestión de Correas, Poleas y Polines</div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`);
    win.document.close();
  }

  const allCriticos=useMemo(()=>{
    const PAD=window.POLEAS_DATA||{};
    const all=[];const seen=new Set();
    const addTag=(proc,tag)=>{
      const k=proc+'|'+tag;if(seen.has(k))return;seen.add(k);
      const pd=(PAD[proc]||{})[tag];
      const nombre=pd?cleanNombre(pd.nombre):beltLabel(tag).nombre;
      hallazgosDe(proc,tag,polAdds)
        .filter(h=>h.estCond==='Activo'&&['Alta','Muy Alta','Media'].includes(h.crit))
        .forEach(h=>all.push({...h,proc,tag,beltNombre:nombre}));
    };
    Object.keys(POLINES).forEach(proc=>Object.keys(POLINES[proc]||{}).forEach(tag=>addTag(proc,tag)));
    polAdds.forEach(h=>addTag(h.proc,h.tag));
    return all.sort((a,b)=>critOf(b.crit).rank-critOf(a.crit).rank||dmyKey(b.fecha)-dmyKey(a.fecha));
  },[polAdds]);

  const filtered=filtroProc==='todos'?allCriticos:allCriticos.filter(h=>h.proc===filtroProc);

  const heatRows=useMemo(()=>{

      const mr=o=>Math.max(0,...Object.keys(o.counts).map(c=>critOf(c).rank));

          📧 Enviar correo
        </button>
        <span style={{marginLeft:'auto',fontSize:'0.714rem',color:'var(--op-text-3)'}}>
          {filtered.length} hallazgo{filtered.length!==1?'s':''}{filtroProc!=='todos'?` · ${PROC_META[filtroProc]?.label}`:''}
        </span>
        {canEdit && <span style={{flexShrink:0,width:1,height:18,background:'var(--op-border-subtle)',margin:'0 2px'}}></span>}

          ⬆ Importar Excel

      </div>

      {/* KPI strip */}
      <div className="kpi-strip" style={{flexShrink:0}}>
        <div className="kpi" style={{borderTopColor:'var(--alarm-critical)'}}>
          <div className="kpi-lbl">Críticos activos</div>
          <div className="kpi-val" style={{color:total>0?'var(--alarm-critical-light)':'var(--op-text-1)'}}>{total}<span className="kpi-unit"> hall.</span></div>
          <div className="kpi-sub">Muy Alta · Alta · Media</div>
        </div>
        {Object.keys(PROC_META).map(p=>{
          const n=allCriticos.filter(h=>h.proc===p).length;
          const correas=heatRows.filter(r=>r.proc===p).length;
          const act=filtroProc===p;
          return (
            <div key={p} className="kpi" style={{borderTopColor:PROC_META[p].dot,cursor:'pointer',outline:act?`2px solid ${PROC_META[p].dot}`:''}} onClick={()=>setFiltroProc(act?'todos':p)}>
              <div className="kpi-lbl">{PROC_META[p].label}</div>
              <div className="kpi-val" style={{color:n>0?'var(--op-text-1)':'var(--op-text-3)'}}>{n}<span className="kpi-unit"> hall.</span></div>
              <div className="kpi-sub">{correas} correa{correas!==1?'s':''} afectada{correas!==1?'s':''}</div>
            </div>
          );
        })}
        <div className="kpi">
          <div className="kpi-lbl">Correas afectadas</div>
          <div className="kpi-val">{heatRows.length}</div>
          <div className="kpi-sub">con críticos activos</div>
        </div>

      {/* Mapa de calor */}
      <div style={{padding:'12px 20px',flexShrink:0}}>
        <div style={{fontSize:'0.714rem',fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--op-text-3)',marginBottom:8,display:'flex',alignItems:'center',gap:10}}>
          Mapa de calor — críticos por correa{filtroProc!=='todos'?` (${PROC_META[filtroProc]?.label})`:' (todos los procesos)'}
          {filtroProc!=='todos'&&<button style={{fontSize:'0.714rem',background:'none',border:'none',color:'var(--cmp-blue-400)',cursor:'pointer',padding:0,fontWeight:400,textTransform:'none',letterSpacing:'normal'}} onClick={()=>setFiltroProc('todos')}>✕ Limpiar filtro</button>}

        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'separate',borderSpacing:'3px',minWidth:520}}>
            <thead>
              <tr>
                <th style={{textAlign:'left',padding:'3px 10px',fontSize:'0.667rem',fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--op-text-3)',minWidth:170}}>Correa / Feeder</th>
                <th style={{textAlign:'left',padding:'3px 8px',fontSize:'0.667rem',fontWeight:600,color:'var(--op-text-3)',minWidth:90}}>Proceso</th>
                {CRIT_COLS.map(c=>(
                  <th key={c} style={{textAlign:'center',padding:'3px 8px',fontSize:'0.667rem',fontWeight:600,color:critOf(c).col,minWidth:90}}>{critOf(c).icon} {c}</th>

                <th style={{textAlign:'center',padding:'3px 8px',fontSize:'0.667rem',fontWeight:600,color:'var(--op-text-3)',minWidth:55}}>Total</th>
                <th style={{textAlign:'left',padding:'3px 8px',fontSize:'0.667rem',fontWeight:600,color:'var(--op-text-3)',minWidth:90}}>Últ. insp.</th>
              </tr>

            <tbody>

              {heatFiltered.map(row=>{
                const tot=Object.values(row.counts).reduce((s,n)=>s+n,0);
                const maxCrit=CRIT_COLS.find(c=>row.counts[c]);
                return (
                  <tr key={row.proc+'|'+row.tag}>

                      </span>
                    </td>
                    {CRIT_COLS.map(c=>{

                      return (
                        <td key={c} style={{textAlign:'center',padding:'4px 8px',background:'var(--op-surface-1)'}}>
                          {n>0
                            ?<span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',minWidth:28,height:22,borderRadius:4,background:critOf(c).col+'26',color:critOf(c).col,fontSize:'0.786rem',fontWeight:700,border:`1px solid ${critOf(c).col}44`,padding:'0 4px'}}>{n}</span>

                    <td style={{textAlign:'center',padding:'4px 8px',background:'var(--op-surface-1)'}}>
                      <span style={{fontWeight:700,color:maxCrit?critOf(maxCrit).col:'var(--op-text-3)',fontSize:'0.857rem'}}>{tot}</span>
                    </td>
                    <td style={{padding:'4px 8px',fontSize:'0.714rem',fontFamily:'var(--font-mono)',color:'var(--op-text-3)',background:'var(--op-surface-1)',borderRadius:'0 var(--radius-1) var(--radius-1) 0'}}>{row.ultima||'—'}</td>

            </tbody>

        </div>
      </div>

      {/* Tabla detalle */}
      <div style={{padding:'0 20px 20px',flex:1,minHeight:0}}>

          <span style={{marginLeft:8,fontWeight:400,textTransform:'none',letterSpacing:'normal',fontSize:'0.714rem',color:'var(--op-text-3)'}}>{filtered.length} hallazgo{filtered.length!==1?'s':''}</span>

                {['Correa / Feeder','Proceso','N° Polín','Identificación','Posición','Condición','Acción','Programación','Criticidad','N° Aviso','Fecha'].map(h=>(
                  <th key={h} className="resumen-th">{h}</th>
                ))}
              </tr>

            <tbody>
              {filtered.length===0&&<tr><td colSpan={11} style={{padding:24,textAlign:'center',color:'var(--op-text-3)',fontSize:'0.857rem'}}>Sin hallazgos críticos activos{filtroProc!=='todos'?` en ${PROC_META[filtroProc]?.label}`:''}</td></tr>}
              {filtered.map((h,i)=>{
                const cr=critOf(h.crit);
                return (
                  <tr key={i} className="resumen-td" style={{background:i%2===0?'var(--op-surface-1)':'var(--op-surface-0)',borderBottom:'1px solid var(--op-border-subtle)'}}>
