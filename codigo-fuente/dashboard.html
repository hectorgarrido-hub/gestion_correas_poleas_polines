                    <td className="resumen-td"><span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'0.714rem',color:'var(--op-text-3)'}}><span style={{width:5,height:5,borderRadius:'50%',background:PROC_META[h.proc]?.dot,display:'inline-block'}}></span>{PROC_META[h.proc]?.label}</span></td>
                    <td className="resumen-td" style={{fontFamily:'var(--font-mono)',textAlign:'center'}}>{h.npolin||'—'}</td>
                    <td className="resumen-td" style={{color:'var(--op-text-2)'}}>{h.ident||'—'}</td>
                    <td className="resumen-td" style={{color:'var(--op-text-2)',whiteSpace:'nowrap'}}>{h.pos||'—'}</td>
                    <td className="resumen-td">{h.cond||'—'}</td>
                    <td className="resumen-td" style={{color:'var(--op-text-2)',whiteSpace:'nowrap'}}>{h.accion||'—'}</td>
                    <td className="resumen-td" style={{color:'var(--op-text-3)',whiteSpace:'nowrap'}}>{h.prog||'—'}</td>
                    <td className="resumen-td" style={{whiteSpace:'nowrap'}}><span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 7px',borderRadius:3,background:cr.col+'22',color:cr.col,fontSize:'0.714rem',fontWeight:700,border:`1px solid ${cr.col}44`}}>{cr.icon} {h.crit}</span></td>
                    <td className="resumen-td" style={{fontFamily:'var(--font-mono)',fontSize:'0.714rem',color:'var(--op-text-3)'}}>{h.aviso||'—'}</td>
                    <td className="resumen-td" style={{fontFamily:'var(--font-mono)',fontSize:'0.714rem',color:'var(--op-text-3)',whiteSpace:'nowrap'}}>{h.fecha||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ── Estado Poleas & TBO (resumen exportable) ──────────── */
function EstadoPoleasView({ overrides, tboOverrides }){
  const [filtroProc,setFiltroProc]=useState('todos');
  const [exporting,setExporting]=useState(false);

  const rows=useMemo(()=>{
    const out=[];
    Object.keys(PROC_META).forEach(proc=>{
      const procData=window.POLEAS_DATA[proc]||{};
      Object.keys(procData).forEach(tag=>{
        const c=procData[tag];
        if(!c||!c.poleas) return;
        const poleas=c.poleas.map(p=>mergePolea(proc,tag,p,overrides));
        const total=poleas.length;
        const sinCambio=poleas.filter(p=>p._estado==='nunca').length;
        const conCambio=total-sinCambio;
        const tboEff=tboOverrides[tkey(proc,tag)]||c.tbo;
        const tboVenc=tboVencido(tboEff);
        const tboDias=diasHastaTBO(tboEff);
        const fechasDias=poleas.map(p=>p._dias).filter(d=>d!=null);
        const ultima=poleas.map(p=>p.fecha).filter(Boolean).sort((a,b)=>parseDMY(b)-parseDMY(a))[0]||null;
        out.push({proc,tag,nombre:cleanNombre(c.nombre),total,sinCambio,conCambio,tboEff,tboVenc,tboDias,ultima});
      });
    });
    return out;
  },[overrides,tboOverrides]);

  const filtered=filtroProc==='todos'?rows:rows.filter(r=>r.proc===filtroProc);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(a.tboVenc!==b.tboVenc) return a.tboVenc?-1:1;
    if(b.sinCambio!==a.sinCambio) return b.sinCambio-a.sinCambio;
    return (a.tboDias??1e9)-(b.tboDias??1e9);
  }),[filtered]);

  // KPIs
  const totCorreas=filtered.length;
  const totPoleas=filtered.reduce((s,r)=>s+r.total,0);
  const totSinCambio=filtered.reduce((s,r)=>s+r.sinCambio,0);
  const totConCambio=totPoleas-totSinCambio;
  const correasSinCambio=filtered.filter(r=>r.sinCambio>0).length;
  const tboVencidos=filtered.filter(r=>r.tboVenc).length;
  const tboProximos=filtered.filter(r=>!r.tboVenc && r.tboDias!=null && r.tboDias<=90).length;

  // color helpers
  function sinCambioCell(n,total){
    if(n===0) return {bg:'var(--status-running-bg)',col:'var(--status-running-light)',bd:'var(--status-running)'};
    return {bg:'var(--alarm-critical-bg)',col:'var(--alarm-critical-light)',bd:'var(--alarm-critical)'};
  }
  function tboCell(r){
    if(r.tboVenc) return {bg:'var(--alarm-critical-bg)',col:'var(--alarm-critical-light)',bd:'var(--alarm-critical)',txt:`▲ VENCIDO`};
    if(r.tboDias!=null && r.tboDias<=90) return {bg:'var(--alarm-warning-bg)',col:'var(--alarm-warning-light)',bd:'var(--alarm-warning)',txt:`◆ ${r.tboDias}d`};
    return {bg:'var(--status-running-bg)',col:'var(--status-running-light)',bd:'var(--status-running)',txt:r.tboDias!=null?`● ${r.tboDias}d`:'—'};
  }

  function exportExcel(){
    if(!window.XLSX){ alert('XLSX no disponible'); return; }
    setExporting(true);
    try{
      const wb=XLSX.utils.book_new();
      const data=[
        ['Correa','Proceso','TAG','Total Poleas','Sin Cambio','Cambiadas','TBO Correa','Días para TBO','Estado TBO Correa','Última Fecha Cambio'],
        ...sorted.map(r=>[
          r.nombre, PROC_META[r.proc]?.label||r.proc, r.tag,
          r.total, r.sinCambio, r.conCambio, r.tboEff||'',
          r.tboDias!=null?r.tboDias:'', r.tboVenc?'VENCIDO':(r.tboDias!=null&&r.tboDias<=90?'Próximo':'OK'),
          r.ultima||''
        ])
      ];
      const ws=XLSX.utils.aoa_to_sheet(data);
      ws['!cols']=[{wch:28},{wch:14},{wch:12},{wch:12},{wch:11},{wch:11},{wch:14},{wch:13},{wch:11},{wch:18}];
      XLSX.utils.book_append_sheet(wb,ws,'Estado Poleas y TBO');
      const hoy=new Date().toLocaleDateString('es-CL').replace(/\//g,'-');
      XLSX.writeFile(wb,`Estado Poleas TBO CMP ${hoy}.xlsx`);
    }catch(e){ alert('Error al exportar: '+e.message); }
    setExporting(false);
  }

  function exportPDF(){
    const hoy=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
    const procLabel=filtroProc==='todos'?'Todos los procesos':PROC_META[filtroProc]?.label||filtroProc;
    const rowsHtml=sorted.map((r,i)=>{
      const sc=r.sinCambio>0?'#b91c1c':'#16a34a';
      const tboTxt=r.tboVenc?'▲ VENCIDO':(r.tboDias!=null&&r.tboDias<=90?`◆ ${r.tboDias}d`:(r.tboDias!=null?`● ${r.tboDias}d`:'—'));
      const tboCol=r.tboVenc?'#b91c1c':(r.tboDias!=null&&r.tboDias<=90?'#b45309':'#16a34a');
      return `<tr style="background:${i%2===0?'#f7f7f7':'#fff'}"><td>${r.nombre}</td><td>${PROC_META[r.proc]?.label||r.proc}</td><td>${r.tag}</td><td style="text-align:center">${r.total}</td><td style="text-align:center;color:${sc};font-weight:700">${r.sinCambio}</td><td style="text-align:center;color:#16a34a;font-weight:700">${r.conCambio}</td><td style="text-align:center;font-family:monospace">${r.tboEff||'—'}</td><td style="text-align:center;color:${tboCol};font-weight:700">${tboTxt}</td><td style="text-align:center;font-family:monospace">${r.ultima||'—'}</td></tr>`;
    }).join('');
    const win=window.open('','_blank','width=1100,height=850');
    if(!win){ alert('Permite las ventanas emergentes para exportar PDF'); return; }
    win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Estado Poleas y TBO CMP ${hoy}</title>
    <style>body{font-family:Arial,sans-serif;font-size:11px;color:#111;margin:24px;background:#fff}
    h1{font-size:15px;margin:0 0 3px;color:#071840}h2{font-size:11px;margin:16px 0 5px;color:#071840;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #071840;padding-bottom:3px}
    .sub{font-size:10px;color:#555;margin-bottom:14px}.kpi-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .kb{border:1px solid #ccc;border-radius:3px;padding:6px 12px;text-align:center;min-width:90px}.kn{font-size:20px;font-weight:700;color:#071840}.kl{font-size:9px;color:#666;margin-top:1px}
    table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:10px}th{background:#071840;color:#fff;padding:4px 7px;text-align:left;font-size:9px;letter-spacing:.04em}
    td{padding:3px 7px;border-bottom:1px solid #e5e5e5;vertical-align:middle}.footer{text-align:right;font-size:9px;color:#aaa;margin-top:12px}
    @media print{body{margin:8px}}</style></head><body>
    <h1>⚙ Estado de Poleas y TBO de Correas — CMP</h1>
    <div class="sub">Proceso: ${procLabel} &nbsp;|&nbsp; Generado: ${hoy} &nbsp;|&nbsp; Total correas: ${totCorreas}</div>
    <div class="kpi-row"><div class="kb"><div class="kn">${totCorreas}</div><div class="kl">Correas</div></div><div class="kb"><div class="kn">${totPoleas}</div><div class="kl">Poleas totales</div></div><div class="kb"><div class="kn" style="color:#16a34a">${totConCambio}</div><div class="kl">Poleas con cambio</div></div><div class="kb"><div class="kn" style="color:${totSinCambio>0?'#b91c1c':'#16a34a'}">${totSinCambio}</div><div class="kl">Poleas sin cambio</div></div><div class="kb"><div class="kn" style="color:${tboVencidos>0?'#b91c1c':'#16a34a'}">${tboVencidos}</div><div class="kl">TBO Correas vencidos</div></div><div class="kb"><div class="kn" style="color:${tboProximos>0?'#b45309':'#16a34a'}">${tboProximos}</div><div class="kl">TBO Correas próximos (≤90d)</div></div></div>
    <h2>Mapa de Estado por Correa</h2>
    <table><thead><tr><th>Correa</th><th>Proceso</th><th>TAG</th><th>Total</th><th>Sin Cambio</th><th>Cambiadas</th><th>TBO Correa</th><th>Estado TBO Correa</th><th>Últ. Cambio Polea</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    <div class="footer">CMP — Gestión de Correas, Poleas y Polines</div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`);
    win.document.close();
  }

  return (
    <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column',minHeight:0}}>
      {/* Toolbar exportar */}
      <div style={{padding:'7px 20px',borderBottom:'1px solid var(--op-border-subtle)',display:'flex',alignItems:'center',gap:8,flexShrink:0,background:'var(--op-surface-1)'}}>
        <span style={{fontSize:'0.786rem',fontWeight:600,color:'var(--op-text-2)',marginRight:4}}>Exportar:</span>
        <button onClick={exportExcel} disabled={exporting||sorted.length===0}
          style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 13px',fontSize:'0.786rem',borderRadius:'var(--radius-1)',background:'var(--op-surface-2)',border:'1px solid var(--op-border-strong)',color:'var(--op-text-1)',cursor:sorted.length===0?'not-allowed':'pointer',opacity:sorted.length===0?0.5:1}}>
          ↓ Excel
        </button>
        <button onClick={exportPDF} disabled={sorted.length===0}
          style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 13px',fontSize:'0.786rem',borderRadius:'var(--radius-1)',background:'var(--op-surface-2)',border:'1px solid var(--op-border-strong)',color:'var(--op-text-1)',cursor:sorted.length===0?'not-allowed':'pointer',opacity:sorted.length===0?0.5:1}}>
          🖨 PDF / Imprimir
        </button>
        <span style={{marginLeft:'auto',fontSize:'0.714rem',color:'var(--op-text-3)'}}>
          {totCorreas} correa{totCorreas!==1?'s':''}{filtroProc!=='todos'?` · ${PROC_META[filtroProc]?.label}`:''}
        </span>
      </div>

      {/* KPI strip */}
      <div className="kpi-strip" style={{flexShrink:0,gridTemplateColumns:'repeat(6,1fr)'}}>
        <div className="kpi" style={{borderTopColor:'var(--cmp-blue-400)'}}>
          <div className="kpi-lbl">Correas</div>
          <div className="kpi-val">{totCorreas}</div>
          <div className="kpi-sub">en {filtroProc==='todos'?'todos los procesos':PROC_META[filtroProc]?.label}</div>
        </div>
        <div className="kpi" style={{borderTopColor:'var(--cmp-blue-400)'}}>
          <div className="kpi-lbl">Poleas totales</div>
          <div className="kpi-val">{totPoleas}</div>
          <div className="kpi-sub">en {totCorreas} correa{totCorreas!==1?'s':''}</div>
        </div>
        <div className="kpi" style={{borderTopColor:'var(--status-running)'}}>
          <div className="kpi-lbl">Poleas con cambio</div>
          <div className="kpi-val" style={{color:'var(--status-running-light)'}}>{totConCambio}</div>
          <div className="kpi-sub">con fecha registrada</div>
        </div>
        <div className="kpi" style={{borderTopColor:totSinCambio>0?'var(--alarm-critical)':'var(--status-running)'}}>
          <div className="kpi-lbl">Poleas sin cambio</div>
          <div className="kpi-val" style={{color:totSinCambio>0?'var(--alarm-critical-light)':'var(--op-text-1)'}}>{totSinCambio>0?'▲ ':''}{totSinCambio}</div>
          <div className="kpi-sub">nunca cambiadas</div>
        </div>
        <div className="kpi" style={{borderTopColor:tboVencidos>0?'var(--alarm-critical)':'var(--status-running)'}}>
          <div className="kpi-lbl">TBO Correas vencidos</div>
          <div className="kpi-val" style={{color:tboVencidos>0?'var(--alarm-critical-light)':'var(--op-text-1)'}}>{tboVencidos>0?'▲ ':''}{tboVencidos}</div>
          <div className="kpi-sub">requieren revisión</div>
        </div>
        <div className="kpi" style={{borderTopColor:'var(--alarm-warning-light)'}}>
          <div className="kpi-lbl">TBO Correas próximos</div>
          <div className="kpi-val" style={{color:tboProximos>0?'var(--alarm-warning-light)':'var(--op-text-1)'}}>{tboProximos}</div>
          <div className="kpi-sub">≤ 90 días</div>
        </div>
      </div>

      {/* filtro por proceso */}
      <div style={{padding:'10px 20px 0',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <span style={{fontSize:'0.714rem',fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase',color:'var(--op-text-3)'}}>Filtrar:</span>
        <button className={`pol-fbtn${filtroProc==='todos'?' active':''}`} onClick={()=>setFiltroProc('todos')} style={{padding:'3px 12px',fontSize:'0.786rem',borderRadius:'var(--radius-1)',border:'1px solid var(--op-border-strong)',background:filtroProc==='todos'?'var(--cmp-blue-600)':'var(--op-surface-2)',color:filtroProc==='todos'?'#fff':'var(--op-text-2)',cursor:'pointer'}}>Todos</button>
        {Object.keys(PROC_META).map(p=>(
          <button key={p} onClick={()=>setFiltroProc(p)} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 12px',fontSize:'0.786rem',borderRadius:'var(--radius-1)',border:'1px solid var(--op-border-strong)',background:filtroProc===p?PROC_META[p].dot:'var(--op-surface-2)',color:filtroProc===p?'#fff':'var(--op-text-2)',cursor:'pointer'}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:filtroProc===p?'#fff':PROC_META[p].dot}}></span>{PROC_META[p].label}
          </button>
        ))}
      </div>

      {/* Mapa de calor / tabla */}
      <div style={{padding:'12px 20px 24px'}}>
        <div style={{fontSize:'0.714rem',fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--op-text-3)',marginBottom:8}}>
          Mapa de estado — poleas & TBO por correa{filtroProc!=='todos'?` (${PROC_META[filtroProc]?.label})`:' (todos los procesos)'}
        </div>
        <div style={{overflowX:'auto'}}>
          <table className="data-table" style={{width:'100%',borderCollapse:'collapse',fontSize:'0.857rem'}}>
            <thead>
              <tr style={{background:'var(--op-surface-2)'}}>
                <th style={{textAlign:'left',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600}}>Correa</th>
                <th style={{textAlign:'left',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600}}>Proceso</th>
                <th style={{textAlign:'center',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600}}>Total Poleas</th>
                <th style={{textAlign:'center',padding:'7px 10px',fontSize:'0.714rem',color:'var(--alarm-critical-light)',fontWeight:600}}>▲ Poleas Sin Cambio</th>
                <th style={{textAlign:'center',padding:'7px 10px',fontSize:'0.714rem',color:'var(--status-running-light)',fontWeight:600}}>● Poleas Cambiadas</th>
                <th style={{textAlign:'center',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600}}>TBO Correa</th>
                <th style={{textAlign:'center',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600}}>Estado TBO Correa</th>
                <th style={{textAlign:'left',padding:'7px 10px',fontSize:'0.714rem',color:'var(--op-text-3)',fontWeight:600,whiteSpace:'nowrap'}}>Últ. Cambio Polea</th>
              </tr>
            </thead>
            <tbody>
              {sorted.length===0&&<tr><td colSpan={8} style={{padding:24,textAlign:'center',color:'var(--op-text-3)'}}>Sin correas con poleas</td></tr>}
              {sorted.map((r,i)=>{
                const sc=sinCambioCell(r.sinCambio,r.total);
                const tc=tboCell(r);
                const bg=i%2===0?'var(--op-surface-1)':'transparent';
                return (
                  <tr key={r.proc+r.tag} style={{background:bg,borderBottom:'1px solid var(--op-border-subtle)'}}>
                    <td style={{padding:'5px 10px',fontWeight:600,color:'var(--op-text-1)',borderLeft:`3px solid ${r.tboVenc?'var(--alarm-critical)':(r.tboDias!=null&&r.tboDias<=90?'var(--alarm-warning-light)':'var(--status-running)')}`}}>{r.nombre}</td>
                    <td style={{padding:'5px 10px',color:'var(--op-text-2)'}}>
                      <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:PROC_META[r.proc].dot,marginRight:5,verticalAlign:'middle'}}></span>
                      <span style={{verticalAlign:'middle'}}>{PROC_META[r.proc].label}</span>
                    </td>
                    <td style={{textAlign:'center',padding:'5px 10px',fontVariantNumeric:'tabular-nums',color:'var(--op-text-1)'}}>{r.total}</td>
                    <td style={{textAlign:'center',padding:'5px 10px'}}>
                      <span style={{display:'inline-block',minWidth:26,padding:'2px 8px',borderRadius:'var(--radius-1)',background:sc.bg,color:sc.col,border:`1px solid ${sc.bd}`,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{r.sinCambio}</span>
                    </td>
                    <td style={{textAlign:'center',padding:'5px 10px'}}>
                      <span style={{display:'inline-block',minWidth:26,padding:'2px 8px',borderRadius:'var(--radius-1)',background:'var(--status-running-bg)',color:'var(--status-running-light)',border:'1px solid var(--status-running)',fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{r.conCambio}</span>
                    </td>
                    <td style={{textAlign:'center',padding:'5px 10px',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',color:'var(--op-text-2)'}}>{r.tboEff||'—'}</td>
                    <td style={{textAlign:'center',padding:'5px 10px'}}>
                      <span style={{display:'inline-block',padding:'2px 9px',borderRadius:'var(--radius-1)',background:tc.bg,color:tc.col,border:`1px solid ${tc.bd}`,fontWeight:700,fontSize:'0.786rem',whiteSpace:'nowrap'}}>{tc.txt}</span>
                    </td>
                    <td style={{padding:'5px 10px',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',color:'var(--op-text-3)',fontSize:'0.786rem',whiteSpace:'nowrap'}}>{r.ultima||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:12,display:'flex',gap:18,flexWrap:'wrap',fontSize:'0.714rem',color:'var(--op-text-3)'}}>
          <span><span style={{color:'var(--status-running)',fontWeight:700}}>●</span> TBO vigente (&gt;90d)</span>
          <span><span style={{color:'var(--alarm-warning-light)',fontWeight:700}}>◆</span> TBO próximo (≤90d)</span>
          <span><span style={{color:'var(--alarm-critical-light)',fontWeight:700}}>▲</span> TBO vencido / poleas sin cambio</span>
        </div>
      </div>
    </div>
  );
}

/* ── App principal ────────────────────────────────────── */
function App({ user, onLogout }){
  const DATA = window.POLEAS_DATA;
  const canEdit = user.role !== 'viewer';
  const [proc,setProc]=useState('MAGNETITA');
  const [tag,setTag]=useState(()=>beltsFor(proc)[0].tag);
  const [vista,setVista]=useState('poleas');
  const [overrides,setOverrides]=useState({});
  const [tboOverrides,setTboOverrides]=useState({});
  const [polAdds,setPolAdds]=useState([]);
  const [audit,setAudit]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [editing,setEditing]=useState(null);
  const [editingTbo,setEditingTbo]=useState(false);
  const [polAdding,setPolAdding]=useState(false);
  const [importing,setImporting]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const [showHist,setShowHist]=useState(false);
  const [showResumen,setShowResumen]=useState(false);
  const [showPoleas,setShowPoleas]=useState(false);
  const [busy,setBusy]=useState(false);
  const [clock,setClock]=useState(new Date());

  async function refresh(){
    try{
      const r=await dbLoadAll(); setOverrides(r.overrides); setTboOverrides(r.tbo); setAudit(r.audit);
      const pol=await dbLoadPolines(); setPolAdds(pol);
      setLoaded(true);
    }
    catch(e){ console.error('refresh', e); setLoaded(true); }
  }
  useEffect(()=>{ refresh(); },[]);
  useEffect(()=>{ const t=setInterval(()=>setClock(new Date()),1000); return ()=>clearInterval(t); },[]);
  // Refresco periódico para ver cambios de otros usuarios (solo en línea)
  useEffect(()=>{ if(!LIVE) return; const t=setInterval(refresh,20000); return ()=>clearInterval(t); },[]);

  function selectProc(p){ const b=beltsFor(p, polAdds); setProc(p); setTag(b[0].tag); setVista(b[0].hasPoleas?'poleas':'polines'); setShowResumen(false); setShowPoleas(false); }

  const belts = beltsFor(proc, polAdds);
  const correas = belts.filter(b=>!b.isFeeder);
  const feeders = belts.filter(b=>b.isFeeder);
  const beltInfo = belts.find(b=>b.tag===tag) || belts[0];
  const hasPoleas = beltInfo.hasPoleas;
  const hasPolines = beltInfo.hasPolines;
  const correa = hasPoleas ? DATA[proc][tag] : null;
  const poleas = useMemo(()=> hasPoleas ? correa.poleas.map(p=>mergePolea(proc,tag,p,overrides)) : [], [proc,tag,correa,overrides,hasPoleas]);
  const polHallazgos = hallazgosDe(proc, tag, polAdds);

  useEffect(()=>{ if(vista==='poleas' && !hasPoleas) setVista('polines'); if(vista==='polines' && !hasPolines) setVista('poleas'); }, [tag,proc]);

  function beltEstadoPeor(t){
    const c=DATA[proc][t];
    let red=false;
    // FS24235 (Apilador CNN): punto siempre rojo — equipo especial, requiere atención visual
    if(t==='FS24235') return 1;
    if(c){ const anyNunca=c.poleas.some(p=>mergePolea(proc,t,p,overrides)._estado==='nunca'); const tboT=tboOverrides[tkey(proc,t)]||c.tbo; red=anyNunca||tboVencido(tboT); }
    const ph=hallazgosDe(proc,t,polAdds);
    const polCrit=ph.some(h=>h.estCond==='Activo' && ['Alta','Muy Alta','Mantención Mayor'].includes(h.crit));
    return (red||polCrit)?1:0;
  }
  function beltSinCambio(t){ const c=DATA[proc][t]; if(!c||!c.poleas) return 0; return c.poleas.filter(p=>mergePolea(proc,t,p,overrides)._estado==='nunca').length; }
  function beltBadge(t){ const n=beltSinCambio(t); return n>0 ? <span className="tab-badge">{n}</span> : null; }
  const rankCol=['var(--status-running)','var(--alarm-critical)'];

  const total=poleas.length;
  const conReg=poleas.filter(p=>p.fecha).length;
  const sinReg=total-conReg;
  const diasArr=poleas.filter(p=>p._dias!=null).map(p=>p._dias);
  const prom=diasArr.length?Math.round(diasArr.reduce((a,b)=>a+b,0)/diasArr.length):null;
  const masAntigua=diasArr.length?Math.max(...diasArr):null;
  const alarmCount=poleas.filter(p=>p._estado==='nunca').length;
  const tboEff = hasPoleas ? (tboOverrides[tkey(proc,tag)] || correa.tbo) : null;
  const tboHasOverride = hasPoleas && !!tboOverrides[tkey(proc,tag)];
  const tboVenc = hasPoleas ? tboVencido(tboEff) : false;
  const tboCount = hasPoleas ? diasHastaTBO(tboEff) : null;

  function openEdit(p){ if(canEdit) setEditing({tag, polea:p}); }

  async function doSave(fields){
    const pol=editing.polea, t=editing.tag;
    setBusy(true);
    const detalle = fields.fecha
      ? `Fecha de cambio → ${fields.fecha}${fields.orden?` · OM ${fields.orden}`:''}${fields.aviso?` · Aviso ${fields.aviso}`:''}`
      : `Fecha de cambio quitada (queda sin cambio)`;
    try{
      await dbSaveOverride(proc,t,pol.num,fields,user.name);
      await dbAddAudit({usuario:user.name, accion:'Editó polea', proceso:proc, correa:DATA[proc][t].nombre, polea:pol.num, detalle});
      await refresh();
      setEditing(null);
    }catch(e){ alert('No se pudo guardar: '+(e.message||e)); }
    setBusy(false);
  }
  async function doClear(){
    const pol=editing.polea, t=editing.tag;
    setBusy(true);
    const fields={ fecha:null, dias:null, orden:null, aviso:null, desc:'Sin cambios registrados', status:'none' };
    try{
      await dbSaveOverride(proc,t,pol.num,fields,user.name);
      await dbAddAudit({usuario:user.name, accion:'Eliminó registro', proceso:proc, correa:DATA[proc][t].nombre, polea:pol.num, detalle:'Registro de cambio eliminado'});
      await refresh();
      setEditing(null);
    }catch(e){ alert('No se pudo limpiar: '+(e.message||e)); }
    setBusy(false);
  }
  async function saveTboDate(dmy){
    setBusy(true);
    try{
      await dbSaveTbo(proc,tag,dmy,user.name);
      await dbAddAudit({usuario:user.name, accion:'Editó TBO', proceso:proc, correa:correa.nombre, polea:null, detalle:`Próxima revisión TBO → ${dmy}`});
      await refresh();
      setEditingTbo(false);
    }catch(e){ alert('No se pudo guardar el TBO: '+(e.message||e)); }
    setBusy(false);
  }
  async function resetTboDate(){
    setBusy(true);
    try{
      await dbResetTbo(proc,tag);
      await dbAddAudit({usuario:user.name, accion:'Restauró TBO', proceso:proc, correa:correa.nombre, polea:null, detalle:'TBO restaurado al valor original'});
      await refresh();
      setEditingTbo(false);
    }catch(e){ alert('No se pudo restaurar: '+(e.message||e)); }
    setBusy(false);
  }
  async function savePolin(h){
    setBusy(true);
    try{
      await dbAddPolin(h,user.name);
      const bNom = beltsFor(h.proc, polAdds).find(b=>b.tag===h.tag)?.nombre || h.tag;
      await dbAddAudit({usuario:user.name, accion:'Registró polín', proceso:h.proc, correa:bNom, polea:null, detalle:`Polín ${h.npolin||''} ${h.pos||''} · ${h.crit} · ${h.cond||''} (${h.fecha})`});
      await refresh();
      setPolAdding(false);
    }catch(e){ alert('No se pudo registrar: '+(e.message||e)); }
    setBusy(false);
  }
  async function delPolin(h){
    if(!confirm('¿Eliminar este hallazgo de polín registrado?')) return;
    setBusy(true);
    try{
      await dbDelPolin(h.id);
      await dbAddAudit({usuario:user.name, accion:'Eliminó polín', proceso:proc, correa:beltInfo.nombre, polea:null, detalle:`Hallazgo de polín eliminado (${h.fecha||'s/f'} · ${h.crit})`});
      await refresh();
    }catch(e){ alert('No se pudo eliminar: '+(e.message||e)); }
    setBusy(false);
  }
  const existingPolMap = useMemo(()=>{
    const m=new Map();
    // BD primero (supersede a la base), luego base semilla
    polAdds.forEach(h=>{ const k=polKey(h); if(!m.has(k)) m.set(k,{id:h.id, estCond:h.estCond||'Activo', src:'db'}); });
    Object.keys(POLINES).forEach(pr=>Object.keys(POLINES[pr]||{}).forEach(tg=>(POLINES[pr][tg]||[]).forEach(h=>{ const k=polKey({...h,proc:pr,tag:tg}); if(!m.has(k)) m.set(k,{id:h.id, estCond:h.estCond||'Activo', src:'base'}); })));
    return m;
  },[polAdds]);

      await dbAddAudit({usuario:user.name, accion:'Importó Excel', proceso:'IMPORTACIÓN', correa:meta.fileName, polea:null, detalle});
      await refresh();
      setImporting(false);
      setImportResult({ count: nuevos, updated: cambios, summary: meta.summary });
    }catch(e){ alert('No se pudo importar: '+(e.message||e)); }
    setBusy(false);
  }

          <div className="nb-brand">
            <span className="nb-name">COMPAÑÍA MINERA DEL PACÍFICO</span>

          </div>

          <button className="nb-btn" onClick={()=>setShowHist(true)}>≣ Historial</button>

      </header>

      <div className="breadcrumb">
        {(showResumen?['CMP','Puerto Punta Totoralillo','Resumen Críticos Activos']:showPoleas?['CMP','Puerto Punta Totoralillo','Estado Poleas & TBO']:['CMP','Puerto Punta Totoralillo',PROC_META[proc].label,beltInfo.nombre]).map((it,i,arr)=>( 
          <React.Fragment key={i}>
            <span className={`bc-item${i===arr.length-1?' active':''}`}>{it}</span>
            {i<arr.length-1 && <span className="bc-sep">›</span>}
          </React.Fragment>
        ))}
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          {!showResumen && !showPoleas && vista==='poleas' && hasPoleas && tboVenc && <span className="alarm-badge" style={{color:'var(--alarm-critical)',background:'var(--alarm-critical-bg)',border:'1px solid var(--alarm-critical-border)'}}>▲ TBO vencido</span>}
          {!showResumen && !showPoleas && vista==='poleas' && hasPoleas && alarmCount>0 && <span className="alarm-badge" style={{color:'var(--alarm-critical)',background:'var(--alarm-critical-bg)',border:'1px solid var(--alarm-critical-border)'}}>▲ {alarmCount} sin cambio</span>}
          {!showResumen && !showPoleas && vista==='poleas' && hasPoleas && !tboVenc && alarmCount===0 && <span className="alarm-badge" style={{color:'var(--status-running)',background:'var(--status-running-bg)',border:'1px solid var(--status-running-border)'}}>● Todas cambiadas</span>}
          {!showResumen && !showPoleas && vista==='polines' && (function(){ const pc=polHallazgos.filter(h=>h.estCond==='Activo'&&['Alta','Muy Alta','Mantención Mayor'].includes(h.crit)).length; return pc>0 ? <span className="alarm-badge" style={{color:'var(--alarm-critical)',background:'var(--alarm-critical-bg)',border:'1px solid var(--alarm-critical-border)'}}>▲ {pc} polines críticos activos</span> : <span className="alarm-badge" style={{color:'var(--status-running)',background:'var(--status-running-bg)',border:'1px solid var(--status-running-border)'}}>● Sin polines críticos activos</span>; })()}
        </div>
      </div>

      <div className="selbar">
        <span className="sel-label">Proceso</span>
        {Object.keys(PROC_META).map(p=>(
          <button key={p} className={`proc-btn${proc===p?' active':''}`} onClick={()=>selectProc(p)}>
            <span className="proc-dot" style={{background:PROC_META[p].dot}}></span>{PROC_META[p].label}
          </button>
        ))}
        <span style={{flexShrink:0,width:1,height:18,background:'var(--op-border-subtle)',margin:'0 4px'}}></span>
        <button className={`proc-btn${showResumen?' active':''}`} onClick={()=>{ setShowResumen(v=>!v); setShowPoleas(false); }}
          style={showResumen?{background:'var(--alarm-critical)',borderColor:'var(--alarm-critical)',color:'#fff'}:{borderColor:'rgba(217,64,64,.5)',color:'var(--alarm-critical-light)'}}>
          ▲ Críticos Polines
        </button>
        <button className={`proc-btn${showPoleas?' active':''}`} onClick={()=>{ setShowPoleas(v=>!v); setShowResumen(false); }}
          style={showPoleas?{background:'var(--cmp-blue-600)',borderColor:'var(--cmp-blue-600)',color:'#fff'}:{borderColor:'rgba(43,111,219,.5)',color:'var(--cmp-blue-300)'}}>
          📊 Estado Poleas & TBO
        </button>
        <span style={{marginLeft:'auto',fontSize:'0.714rem',color:'var(--op-text-3)'}}>
          {!showResumen && !showPoleas && <>{belts.length} correas</> }
        </span>
      </div>

      {showResumen
        ? <ResumenCriticosView polAdds={polAdds} canEdit={canEdit} onImport={()=>setImporting(true)} onAddPolin={()=>setPolAdding(true)}/>
        : showPoleas
        ? <EstadoPoleasView overrides={overrides} tboOverrides={tboOverrides}/>
        : <><div className={`tabs${feeders.length>0?' has-feeders':''}`}>
        {feeders.length>0 ? (
          <>
            <div className="tabs-row">
              {correas.map(b=>{
                const worst=beltEstadoPeor(b.tag);
                return (
                  <button key={b.tag} className={`tab${tag===b.tag?' active':''}`} onClick={()=>setTag(b.tag)}>
                    <span className="tab-alarm" style={{background:worst?'var(--alarm-critical)':'var(--status-running)'}}></span>
                    {b.nombre}{beltBadge(b.tag)}
                  </button>
                );
              })}
            </div>
            <div className="tabs-row feeder-row">
              <span className="tabs-row-label">Feeders</span>
              {feeders.map(b=>{
                const worst=beltEstadoPeor(b.tag);
                return (
                  <button key={b.tag} className={`tab${tag===b.tag?' active':''}`} onClick={()=>setTag(b.tag)}
                    style={tag===b.tag?{}:{color:'var(--status-running-light)'}}>
                    <span className="tab-alarm" style={{background:worst?'var(--alarm-critical)':'var(--status-running)'}}></span>
                    {b.nombre}{beltBadge(b.tag)}
                  </button>
                );
              })}
            </div>
          </>
        ) : (
          correas.map(b=>{
            const worst=beltEstadoPeor(b.tag);
            return (
              <button key={b.tag} className={`tab${tag===b.tag?' active':''}`} onClick={()=>setTag(b.tag)}>
                <span className="tab-alarm" style={{background:worst?'var(--alarm-critical)':'var(--status-running)'}}></span>
                {b.nombre}{beltBadge(b.tag)}
              </button>
            );
          })
        )}
      </div>

      <div className="main">
        {(hasPoleas && hasPolines) && (
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
            <div className="vista-toggle">
              <button className={`vista-btn${vista==='poleas'?' active':''}`} onClick={()=>setVista('poleas')}>⚙ Poleas <span className="vista-count">{correa.poleas.length}</span></button>
              <button className={`vista-btn${vista==='polines'?' active':''}`} onClick={()=>setVista('polines')}>▦ Polines <span className="vista-count">{polHallazgos.length}</span></button>
            </div>
          </div>
        )}

        {vista==='poleas' && hasPoleas && (<>
        <div className="kpi-strip">

          <div className="kpi"><div className="kpi-lbl">Con Registro</div><div className="kpi-val">{conReg}<span className="kpi-unit">/ {total}</span></div><div className="kpi-sub">{sinReg} sin fecha de cambio</div></div>
          <div className="kpi" style={{borderTopColor: alarmCount>0?'var(--alarm-critical)':'var(--op-border-subtle)'}}>
            <div className="kpi-lbl">Sin Cambio</div>

          <div className={`kpi-tbo${tboVenc?' venc':''}`}>

              {canEdit && <button className="tbo-edit" onClick={()=>setEditingTbo(true)}>✎ Editar fecha</button>}
            </div>
            <div className="kpi-tbo-date">{tboVenc&&<span className="tbo-flag">▲</span>}{tboEff}</div>
            <div className="kpi-tbo-sub">
              <span>{tboCount==null ? '—'
                : tboCount<0 ? `VENCIDO hace ${Math.abs(tboCount)} días — requiere revisión`
                : `Faltan ${tboCount} días · ${fmtDias(tboCount)}`}</span>
              {tboHasOverride && <span className="kpi-tbo-edited">✎ editado</span>}
            </div>
          </div>
        </div>

        <div className="belt-hdr">
          <span className="belt-name">{beltInfo.nombre}</span>
          <div className="belt-meta">

              ? <span className="belt-chip belt-chip-crit">▲ {alarmCount} sin cambio</span>
              : <span className="belt-chip belt-chip-ok">● al día</span>}

            <span className={`belt-chip${tboVenc?' belt-chip-crit':(tboCount!=null&&tboCount<=30?' belt-chip-age':'')}`}>TBO {tboEff}{tboVenc?' · VENCIDO':(tboCount!=null?` · en ${fmtDias(tboCount)}`:'')}</span>

          <span style={{fontWeight:500,color:'var(--op-text-2)'}}>Como leer el diagrama:</span>
          <span className="legend-item">
            <svg width="24" height="24" viewBox="0 0 40 40" style={{flex:'none'}}><Wheel cx={20} cy={20} col="var(--op-text-2)" num={null} drive={false}/></svg>
            Cada rueda es una polea (N.º al centro)
          </span>
          <span className="legend-item">
            <svg width="24" height="24" viewBox="0 0 40 40" style={{flex:'none'}}><Wheel cx={20} cy={20} col="var(--op-text-2)" num={null} drive={true}/></svg>
            Doble aro = polea Motriz
          </span>
          <span className="legend-item"><span style={{color:'var(--status-running)',fontWeight:600}}>●</span>Verde: cambiada (con fecha registrada)</span>
          <span className="legend-item"><span style={{color:'var(--alarm-critical)',fontWeight:600}}>●</span>Rojo: sin cambio (nunca cambiada)</span>
        </div>

        <div className="polea-grid">
          {poleas.map(p=><PoleaCard key={p.num} p={p} onEdit={openEdit} canEdit={canEdit}/>)}
        </div>
        </>)}

        {vista==='polines' && hasPolines && (
          <PolinesView proc={proc} tag={tag} beltNombre={beltInfo.nombre} hallazgos={polHallazgos} canEdit={canEdit} onAdd={()=>setPolAdding(true)} onImport={()=>setImporting(true)} onDelete={delPolin}/>
        )}
      </div>
      </>
      }

      <div className="statusbar">
        <span className="sb-item"><span style={{width:6,height:6,borderRadius:'50%',background:LIVE?'var(--status-running)':'var(--alarm-warning)',display:'inline-block'}}></span>{LIVE?'En línea · datos compartidos':'Modo demo · datos locales'}</span>
        <span className="sb-item">{loaded?`${audit.length} movimientos en historial`:'Cargando…'}</span>
        <span className="sb-item" style={{marginLeft:'auto'}}>{PROC_META[proc].label} · {beltInfo.nombre} · {dateStr} {timeStr}</span>
        <span className="sb-item">Diseñado por Héctor Garrido Pérez</span>
        <span className="sb-item"><a href="index.html">CMP Design System v1.0</a></span>
      </div>

      {editing && (
        <EditModal key={okey(proc, editing.tag, editing.polea.num)}
          proc={proc} tag={editing.tag} correa={DATA[proc][editing.tag]} polea={editing.polea}
          onSave={doSave} onClear={doClear} onClose={()=>setEditing(null)} busy={busy}/>
      )}
      {editingTbo && (
        <TboModal key={tkey(proc,tag)}
          proc={proc} tag={tag} correa={correa} tboEff={tboEff} hasOverride={tboHasOverride}
          onSave={saveTboDate} onReset={resetTboDate} onClose={()=>setEditingTbo(false)} busy={busy}/>
      )}
      {showHist && <HistorialModal audit={audit} onClose={()=>setShowHist(false)}/>}
      {polAdding && (
        <PolinModal proc={proc} tag={tag} beltNombre={beltInfo.nombre}
          onSave={savePolin} onClose={()=>setPolAdding(false)} busy={busy}/>
      )}
      {importing && (
        <ImportModal existing={existingPolMap} onImport={doImport} onClose={()=>setImporting(false)} busy={busy}/>
      )}
      {importResult && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'var(--op-surface-1)',border:'1px solid var(--op-border-subtle)',borderRadius:'var(--radius-2)',padding:'28px 32px',maxWidth:420,width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
            <div style={{fontSize:'2rem',textAlign:'center',marginBottom:8}}>✅</div>
            <div style={{fontWeight:700,fontSize:'1rem',color:'var(--op-text-1)',textAlign:'center',marginBottom:6}}>Importación completada</div>
            <div style={{fontSize:'0.857rem',color:'var(--op-text-2)',textAlign:'center',marginBottom:20}}>{importResult.count} hallazgos nuevos{importResult.updated?` · ${importResult.updated} actualizados`:''} · {importResult.summary}</div>
            <div style={{fontSize:'0.786rem',color:'var(--op-text-3)',textAlign:'center',marginBottom:16}}>¿Deseas enviar ahora el resumen de críticos activos por correo a los responsables?</div>
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              <button className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}} onClick={async()=>{
                try{
                  const r=await fetch(`${SUPABASE_URL}/functions/v1/enviar-resumen-criticos`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},body:JSON.stringify({manual:true})});
                  const d=await r.json();
                  alert(d.ok?'✅ Correo enviado correctamente':'Error: '+(d.error||'desconocido'));
                }catch(e){ alert('Error de red: '+e.message); }
                setImportResult(null);
              }}>📧 Enviar resumen por correo</button>
              <button className="btn-secondary" onClick={()=>setImportResult(null)}>Ahora no</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Root: maneja autenticación ───────────────────────── */
function Root(){
  const [session,setSession]=useState(LIVE?undefined:null); // undefined=cargando, null=sin login
  const [demoUser,setDemoUser]=useState(null);

  useEffect(()=>{
    if(!LIVE) return;
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub } = sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  if(LIVE){
    if(session===undefined) return <div className="loading-bg">Conectando…</div>;
    if(!session) return <Login/>;
    const u = session.user;
    const user = { name: (u.user_metadata && u.user_metadata.full_name) || u.email, role: (u.user_metadata && u.user_metadata.role) || 'editor' };
    return <App user={user} onLogout={()=>sb.auth.signOut()}/>;
  } else {
    if(!demoUser) return <Login onDemo={(name)=>setDemoUser({name, role:'editor'})}/>;
    return <App user={demoUser} onLogout={()=>setDemoUser(null)}/>;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
